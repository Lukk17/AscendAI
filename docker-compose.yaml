name: ascend-ai

include:
  - ascend-scrapper.docker-compose.yaml

services:

  # ─── Document processing services ───

  docling-serve:
    image: quay.io/docling-project/docling-serve:v1.14.0
    container_name: docling-serve
    restart: unless-stopped
    ports:
      - "5001:5001"
    # Keep UVICORN_WORKERS and the memory limit in sync: each easyocr worker peaks ~2 GB.
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          memory: 2g
        limits:
          memory: 8g
    environment:
      - DOCLING_SERVE_ENABLE_UI=1
      - DOCLING_SERVE_OCR_ENGINE=easyocr
      - UVICORN_WORKERS=2
    networks:
      default:
        aliases:
          - docling-serve

  unstructured-api:
    image: downloads.unstructured.io/unstructured-io/unstructured-api:0.0.90
    container_name: unstructured-api
    restart: unless-stopped
    ports:
      - "9080:8000"
    # Memory sized from measured usage: all-time peak observed at 2.23 GiB
    # (docker stats, 2026-09-04). 3G keeps roughly 35% headroom over that peak.
    deploy:
      resources:
        limits:
          memory: 3G
    networks:
      default:
        aliases:
          - unstructured-api

  ascend-ocr:
    build:
      context: ./ascend-ocr
      dockerfile: Dockerfile
    image: ascend-ocr:local
    container_name: ascend-ocr
    hostname: ascend-ocr
    restart: unless-stopped
    ports:
      - "7022:7022"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - API_PORT=7022
      - API_HOST=0.0.0.0
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - DEFAULT_LANGUAGE=en
      - MAX_FILE_SIZE_MB=50
      - OCR_REQUEST_TIMEOUT=300
      - ENGINE_CACHE_MAX_SIZE=8
      # SSRF guard: the host-published object store (Floci) is reached via
      # the host-bound localhost address (host.docker.internal:9070) per ADR-001.
      - MCP_ALLOWED_HOSTS=host.docker.internal,localhost,127.0.0.1
      - MCP_DOWNLOAD_TIMEOUT_SECONDS=30
      # file:// is disabled by default; mount a writable dir and set
      # MCP_FILE_URI_ROOT to the in-container path to enable.
      # - MCP_FILE_URI_ROOT=/var/lib/ascend-ocr/uploads
      - RATE_LIMIT_DEFAULT=60/minute
      - RATE_LIMIT_OCR=20/minute
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=ascend-ocr
      - OTEL_RESOURCE_ATTRIBUTES=service.version=0.1.0
    networks:
      default:
        aliases:
          - ascend-ocr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7022/health"]
      interval: 30s
      timeout: 30s
      start_period: 120s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 12G
        reservations:
          cpus: "0.5"
          memory: 2G

  # ─── Application services ───

  ascend-agent:
    build:
      context: ./AscendAgent
      dockerfile: Dockerfile
    container_name: ascend-agent
    hostname: ascend-agent
    restart: unless-stopped
    ports:
      - "9917:9917"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ascend-memory
      - docling-serve
      - unstructured-api
    environment:
      # Activate container-mode overrides (src/main/resources/application-docker.yaml).
      - SPRING_PROFILES_ACTIVE=docker
      # Provider API keys — runtime-only, sourced from .env on the host.
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ASCEND_ANTHROPIC_API_KEY=${ASCEND_ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      # Chat-history backend toggles. Default true. Set either to false in .env
      # to opt out of that persistence layer at runtime. The env-var names use
      # Spring Boot's canonical form for kebab-case properties (hyphens removed):
      # APP_MEMORY_CHATHISTORY_REDIS_ENABLED binds to app.memory.chat-history.redis.enabled.
      - APP_MEMORY_CHATHISTORY_REDIS_ENABLED=${APP_MEMORY_CHATHISTORY_REDIS_ENABLED:-true}
      - APP_MEMORY_CHATHISTORY_POSTGRES_ENABLED=${APP_MEMORY_CHATHISTORY_POSTGRES_ENABLED:-true}
      # Async summarisation of older chat turns when a conversation crosses the
      # configured threshold. Only the boolean toggle is env-bindable; the
      # per-provider compaction-model map stays yaml-only (Spring Boot env-var
      # binding for nested Map<String,String> is awkward).
      - APP_MEMORY_CHATHISTORY_COMPACTION_ENABLED=${APP_MEMORY_CHATHISTORY_COMPACTION_ENABLED:-true}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=ascend-agent
      - OTEL_RESOURCE_ATTRIBUTES=service.version=1.0.0
    networks:
      default:
        aliases:
          - ascend-agent
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9917/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Memory sized from measured usage: peak observed at 831 MiB over 14h
    # (docker stats, 2026-09-04). 3G is deliberately generous headroom above
    # that steady state for a large document ingest, since the multipart
    # ceiling is 100 MB and the PDF path materialises every page as a
    # separate byte array held simultaneously. The Dockerfile's
    # JAVA_TOOL_OPTIONS pins heap to 70% of this limit, so raising or
    # lowering this value moves the heap ceiling with it.
    deploy:
      resources:
        limits:
          memory: 3G

  ascend-memory:
    build:
      context: ./AscendMemory
      dockerfile: Dockerfile
    container_name: ascend-memory
    hostname: ascend-memory
    restart: unless-stopped
    ports:
      - "7020:7020"
    environment:
      - API_PORT=7020
      - API_HOST=0.0.0.0
      # Qdrant must be running externally (port 6333)
      - QDRANT_HOST=host.docker.internal
      - QDRANT_PORT=6333
      # Per-provider routing — each provider hits its own endpoint with its own key.
      - LMSTUDIO_BASE_URL=http://host.docker.internal:1234/v1
      - LMSTUDIO_API_KEY=sk_local
      - OPENAI_BASE_URL=https://api.openai.com/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MEM0_INFER_MEMORY=false
      # - MEM0_INFER_MEMORY=true
      - MEM0_DEFAULT_PROVIDER=lmstudio
      # - MEM0_DEFAULT_PROVIDER=openai
      - LOG_LEVEL=INFO
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=ascend-memory
      - OTEL_RESOURCE_ATTRIBUTES=service.version=0.1.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:7020/health"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 3
    # Memory sized from measured usage: this container is a thin REST/MCP
    # proxy to external Qdrant and embedding APIs, no local model loading,
    # observed at ~85M steady state (docker stats, 2026-09-04). 512M/128M
    # keeps roughly 4-6x headroom over that baseline.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: false
    networks:
      default:
        aliases:
          - ascend-memory

  ascend-weather-mcp:
    build:
      context: ./ascend-weather-mcp
      dockerfile: Dockerfile
    # image: lukk17/ascend-weather-mcp:latest
    container_name: ascend-weather-mcp
    hostname: ascend-weather-mcp
    restart: unless-stopped
    ports:
      - "9998:9998"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=ascend-weather-mcp
      - OTEL_RESOURCE_ATTRIBUTES=service.version=1.0.0
    # Memory sized from measured usage: peak observed at 374 MiB over 24h
    # (docker stats, 2026-09-04). The Dockerfile already pins heap to 70% of
    # this limit via JAVA_TOOL_OPTIONS, so this value and that heap setting
    # move together.
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      default:
        aliases:
          - ascend-weather-mcp

  ascend-audio-scribe:
    build:
      context: ./ascend-audio-scribe
      dockerfile: Dockerfile
    # image: lukk17/ascend-audio-scribe:latest
    container_name: ascend-audio-scribe
    hostname: ascend-audio-scribe
    restart: unless-stopped
    ports:
      - "7017:7017"
    environment:
      - HF_HOME=/hf-cache
      - HF_TOKEN=${HF_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # SSRF guard: the host-published object store (Floci) is reached via
      # the host-bound localhost address (host.docker.internal:9070); allow
      # the loopback aliases.
      - MCP_ALLOWED_HOSTS=host.docker.internal,localhost,127.0.0.1
      # Enables file:// URIs jailed to /audio (the host Desktop mount).
      - MCP_FILE_URI_ROOT=/audio
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=ascend-audio-scribe
      - OTEL_RESOURCE_ATTRIBUTES=service.version=0.1.0
    volumes:
      - D:/Development/AI/hf-cache:/hf-cache
      - C:\Users\Lukk\Desktop:/audio
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:7017/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8192M
        reservations:
          cpus: "0.5"
          memory: 1024M
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          - ascend-audio-scribe

  # ─── Observability stack ───

  # Exposes per-container memory used vs. the deploy.resources.limits.memory
  # ceiling (container_memory_used_bytes / container_memory_limit_bytes) to
  # Prometheus, since neither JVM heap metrics nor Python RSS metrics see the
  # container's cgroup limit or its own non-heap overhead. First-party
  # exporter (source in infra/observability/container-metrics-exporter/): cAdvisor
  # was tried first and rejected because Docker Desktop's containerd-backed
  # image store never populates the legacy overlayfs layerdb metadata
  # cAdvisor's docker handler requires, so it silently reports only the host
  # root cgroup. This exporter reads only the Docker Engine API stats
  # endpoint over the socket, so it needs no /sys or /var/lib/docker mount
  # and no privileged mode, only group-read access to the socket.
  container-metrics-exporter:
    build:
      context: ./infra/observability/container-metrics-exporter
    container_name: container-metrics-exporter
    hostname: container-metrics-exporter
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      default:
        aliases:
          - container-metrics-exporter

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    ports:
      - "7077:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=72h
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - prometheus

  grafana:
    image: grafana/grafana:11.4.0
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    ports:
      - "7078:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Editor
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SERVER_ROOT_URL=http://localhost:7078
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      default:
        aliases:
          - grafana

  loki:
    image: grafana/loki:3.3.2
    container_name: loki
    hostname: loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./infra/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      default:
        aliases:
          - loki

  vector:
    image: timberio/vector:0.42.0-alpine
    container_name: vector
    hostname: vector
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./infra/observability/vector/vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      default:
        aliases:
          - vector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    container_name: otel-collector
    hostname: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector/otel-collector-config.yaml"]
    volumes:
      - ./infra/observability/otel-collector/otel-collector-config.yaml:/etc/otel-collector/otel-collector-config.yaml:ro
    networks:
      default:
        aliases:
          - otel-collector

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tempo
    hostname: tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo-config.yaml"]
    volumes:
      - ./infra/observability/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    networks:
      default:
        aliases:
          - tempo

volumes:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
