auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: ${LOKI_RESULTS_CACHE_MAX_SIZE_MB:-100}

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${LOKI_RETENTION_PERIOD:-2160h}
  otlp_config:
    resource_attributes:
      attributes_config:
        - action: index_label
          attributes:
            - service
            - source

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: ${LOKI_RETENTION_DELETE_DELAY:-2h}
  delete_request_store: filesystem

ruler:
  alertmanager_url: http://localhost:9093

analytics:
  reporting_enabled: false
