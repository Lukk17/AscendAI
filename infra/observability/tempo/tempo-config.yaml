stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: ${TEMPO_LOG_LEVEL:-info}

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

live_store:
  max_block_duration: ${TEMPO_MAX_BLOCK_DURATION:-5m}

backend_scheduler:
  provider:
    compaction:
      compaction:
        block_retention: ${TEMPO_BLOCK_RETENTION:-2160h}

backend_worker:
  compaction:
    block_retention: ${TEMPO_BLOCK_RETENTION:-2160h}

metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: ${OBSERVABILITY_CLUSTER_LABEL:-ascend-ai-local}
  storage:
    path: /var/tempo/generator/wal

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9095

query_frontend:
  search:
    duration_slo: ${TEMPO_SEARCH_DURATION_SLO:-5s}
    throughput_bytes_slo: ${TEMPO_SEARCH_THROUGHPUT_BYTES_SLO:-1073741824}
  trace_by_id:
    duration_slo: ${TEMPO_TRACE_BY_ID_DURATION_SLO:-5s}

overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
