global:
  scrape_interval: ${PROMETHEUS_SCRAPE_INTERVAL}
  evaluation_interval: ${PROMETHEUS_EVALUATION_INTERVAL}
  external_labels:
    cluster: ${OBSERVABILITY_CLUSTER_LABEL}

rule_files:
  - /prometheus/token-price-rules.yaml

scrape_configs:

  # ─── AscendAI application services ───

  - job_name: ascend-agent
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [ascend-agent]
        type: A
        port: 9918
    relabel_configs:
      - target_label: service
        replacement: ascend-agent

  - job_name: ascend-weather-mcp
    metrics_path: /actuator/prometheus
    dns_sd_configs:
      - names: [ascend-weather-mcp]
        type: A
        port: 9998
    relabel_configs:
      - target_label: service
        replacement: ascend-weather-mcp

  - job_name: ascend-memory
    metrics_path: /metrics
    dns_sd_configs:
      - names: [ascend-memory]
        type: A
        port: 7020
    relabel_configs:
      - target_label: service
        replacement: ascend-memory

  - job_name: ascend-audio-scribe
    metrics_path: /metrics
    dns_sd_configs:
      - names: [ascend-audio-scribe]
        type: A
        port: 7017
    relabel_configs:
      - target_label: service
        replacement: ascend-audio-scribe

  - job_name: ascend-web-hunter
    metrics_path: /metrics
    dns_sd_configs:
      - names: [ascend-web-hunter]
        type: A
        port: 7021
    relabel_configs:
      - target_label: service
        replacement: ascend-web-hunter

  - job_name: ascend-ocr
    metrics_path: /metrics
    dns_sd_configs:
      - names: [ascend-ocr]
        type: A
        port: 7022
    relabel_configs:
      - target_label: service
        replacement: ascend-ocr

  # ─── Container runtime (cgroup memory vs. limit) ───

  - job_name: container-metrics-exporter
    metrics_path: /metrics
    static_configs:
      - targets:
          - container-metrics-exporter:8080

  # ─── Data stores (native metrics) ───

  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets:
          - ${PROMETHEUS_QDRANT_TARGET}
    relabel_configs:
      - target_label: service
        replacement: qdrant

  - job_name: redis
    metrics_path: /metrics
    static_configs:
      - targets:
          - redis-exporter:9121
    relabel_configs:
      - target_label: service
        replacement: redis

  - job_name: postgres
    metrics_path: /metrics
    static_configs:
      - targets:
          - postgres-exporter:9187
    relabel_configs:
      - target_label: service
        replacement: postgres
