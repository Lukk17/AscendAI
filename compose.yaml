name: ascend-ai

include:
  - compose.ascend-web-hunter.yaml

services:

  # ─── Document processing services ───

  docling-serve:
    image: quay.io/docling-project/docling-serve:v1.14.0@sha256:b3fff85ccbe54c76a3fc318af603ad6d2cf7e143975fda7c6758b70d0f32b208
    container_name: docling-serve
    restart: unless-stopped
    ports:
      - "${DOCLING_SERVE_HOST_PORT:-5001}:5001"
    # Keep UVICORN_WORKERS and the memory limit in sync: each easyocr worker peaks ~2 GB.
    shm_size: "2gb"
    deploy:
      resources:
        reservations:
          memory: 2g
        limits:
          memory: 10g
    environment:
      - DOCLING_SERVE_ENABLE_UI=1
      - DOCLING_SERVE_OCR_ENGINE=easyocr
      - UVICORN_WORKERS=2
    networks:
      default:
        aliases:
          - docling-serve

  unstructured-api:
    image: downloads.unstructured.io/unstructured-io/unstructured-api:0.0.90@sha256:54282d3a25f33fd6cf69bc45b3d37770f213593f58b6dfe5e85fe546376b2807
    container_name: unstructured-api
    restart: unless-stopped
    ports:
      - "${UNSTRUCTURED_API_HOST_PORT:-9080}:8000"
    # Memory sized from measured usage: all-time peak observed at 2.23 GiB
    # (docker stats, 2026-09-04). 3G keeps roughly 35% headroom over that peak.
    deploy:
      resources:
        limits:
          memory: 3G
    networks:
      default:
        aliases:
          - unstructured-api

  ascend-ocr:
    build:
      context: ./apps/ascend-ocr
      dockerfile: Dockerfile
      additional_contexts:
        ascend-python-common: ./libs/ascend-python-common
    image: ascend-ai-ascend-ocr:latest
    container_name: ascend-ocr
    hostname: ascend-ocr
    logging:
      driver: json-file
    restart: unless-stopped
    ports:
      - "${OCR_HOST_PORT:-7022}:${OCR_API_PORT:-7022}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${OCR_API_PORT:-7022}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - RATE_LIMIT_DEFAULT=${OCR_RATE_LIMIT_DEFAULT:-600/minute}
      - RATE_LIMIT_OCR=${RATE_LIMIT_OCR:-60/minute}
      - READINESS_PROBE_TIMEOUT_SECONDS=${READINESS_PROBE_TIMEOUT_SECONDS:-3}
      - STARTUP_PROBE_TIMEOUT_SECONDS=${STARTUP_PROBE_TIMEOUT_SECONDS:-2}
      - SECURITY_HSTS_MAX_AGE_SECONDS=${SECURITY_HSTS_MAX_AGE_SECONDS:-63072000}
      - MCP_DOWNLOAD_TIMEOUT_SECONDS=${MCP_DOWNLOAD_TIMEOUT_SECONDS:-30}
      - FETCH_MAX_REDIRECT_HOPS=${OCR_FETCH_MAX_REDIRECT_HOPS:-0}
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
      - DEFAULT_LANGUAGE=en
      - MAX_FILE_SIZE_MB=50
      - ENGINE_CACHE_MAX_SIZE=2
      # Result store: the same Floci instance the agent uses, reached from inside the
      # container by its host-published address, with presigned URLs signed against the
      # address a caller on the host can fetch. Its own bucket, never the agent's
      # knowledge-base, whose contents the agent's manual ingestion indexes as sources.
      - OCR_RESULT_S3_ENDPOINT=http://host.docker.internal:9070
      - OCR_RESULT_S3_PUBLIC_ENDPOINT=http://localhost:9070
      - OCR_RESULT_S3_BUCKET=ocr-results
      - OCR_RESULT_S3_ACCESS_KEY=${OCR_RESULT_S3_ACCESS_KEY:-admin}
      - OCR_RESULT_S3_SECRET_KEY=${OCR_RESULT_S3_SECRET_KEY:-password}
      # SSRF guard: the host-published object store (Floci) is reached via
      # the host-bound localhost address (host.docker.internal:9070) per ADR-001.
      - ALLOWED_PRIVATE_HOSTS=host.docker.internal,localhost,127.0.0.1
      # file:// is disabled by default; mount a writable dir and set
      # MCP_FILE_URI_ROOT to the in-container path to enable.
      # - MCP_FILE_URI_ROOT=/var/lib/apps/ascend-ocr/uploads
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - REDIS_URL=${REDIS_URL:-redis://host.docker.internal:6379/0}
      - OTEL_SERVICE_NAME=ascend-ocr
      - OTEL_RESOURCE_ATTRIBUTES=service.version=0.3.1
    networks:
      default:
        aliases:
          - ascend-ocr
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${OCR_API_PORT:-7022}/health"]
      interval: 30s
      timeout: 30s
      start_period: 120s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 2G

  # ─── Application services ───

  ascend-agent:
    build:
      context: ./apps/ascend-agent
      dockerfile: Dockerfile
    image: ascend-ai-ascend-agent:latest
    container_name: ascend-agent
    hostname: ascend-agent
    logging:
      driver: json-file
    restart: unless-stopped
    ports:
      - "${AGENT_HOST_PORT:-9917}:9917"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - ascend-memory
      - docling-serve
      - unstructured-api
    environment:
      # Activate container-mode overrides (src/main/resources/application-docker.yaml).
      - SPRING_PROFILES_ACTIVE=docker
      # Provider API keys - runtime-only, sourced from .env on the host.
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ASCEND_ANTHROPIC_API_KEY=${ASCEND_ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY}
      # Chat-history backend toggles. Default true. Set either to false in .env
      # to opt out of that persistence layer at runtime. The env-var names use
      # Spring Boot's canonical form for kebab-case properties (hyphens removed):
      # APP_MEMORY_CHATHISTORY_REDIS_ENABLED binds to app.memory.chat-history.redis.enabled.
      - APP_MEMORY_CHATHISTORY_REDIS_ENABLED=${APP_MEMORY_CHATHISTORY_REDIS_ENABLED:-true}
      - APP_MEMORY_CHATHISTORY_POSTGRES_ENABLED=${APP_MEMORY_CHATHISTORY_POSTGRES_ENABLED:-true}
      # Async summarisation of older chat turns when a conversation crosses the
      # configured threshold. Only the boolean toggle is env-bindable; the
      # per-provider compaction-model map stays yaml-only (Spring Boot env-var
      # binding for nested Map<String,String> is awkward).
      - APP_MEMORY_CHATHISTORY_COMPACTION_ENABLED=${APP_MEMORY_CHATHISTORY_COMPACTION_ENABLED:-true}
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://otel-collector:4318/v1/traces}
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-1.0}
      - OTEL_SERVICE_NAME=ascend-agent
      - OTEL_RESOURCE_ATTRIBUTES=service.version=0.1.3
    networks:
      default:
        aliases:
          - ascend-agent
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9918/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Memory sized from measured usage: peak observed at 831 MiB over 14h
    # (docker stats, 2026-09-04). 3G is deliberately generous headroom above
    # that steady state for a large document ingest, since the multipart
    # ceiling is 100 MB and the PDF path materialises every page as a
    # separate byte array held simultaneously. The Dockerfile's
    # JAVA_TOOL_OPTIONS pins heap to 70% of this limit, so raising or
    # lowering this value moves the heap ceiling with it.
    deploy:
      resources:
        limits:
          memory: 3G

  ascend-memory:
    build:
      context: ./apps/ascend-memory
      dockerfile: Dockerfile
      additional_contexts:
        ascend-python-common: ./libs/ascend-python-common
    image: ascend-ai-ascend-memory:latest
    container_name: ascend-memory
    hostname: ascend-memory
    logging:
      driver: json-file
    restart: unless-stopped
    ports:
      - "${MEMORY_API_PORT:-7020}:${MEMORY_API_PORT:-7020}"
    environment:
      - API_PORT=${MEMORY_API_PORT:-7020}
      - API_HOST=${API_HOST:-0.0.0.0}
      # Qdrant must be running externally (port 6333)
      - QDRANT_HOST=host.docker.internal
      - QDRANT_PORT=6333
      # Per-provider routing - each provider hits its own endpoint with its own key.
      - LMSTUDIO_BASE_URL=http://host.docker.internal:1234/v1
      - LMSTUDIO_API_KEY=sk_local
      - OPENAI_BASE_URL=https://api.openai.com/v1
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_BASE_URL=https://generativelanguage.googleapis.com/v1beta/openai/
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MEM0_INFER_MEMORY=false
      # - MEM0_INFER_MEMORY=true
      - MEM0_DEFAULT_PROVIDER=lmstudio
      # - MEM0_DEFAULT_PROVIDER=openai
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - REDIS_URL=${REDIS_URL:-redis://host.docker.internal:6379/0}
      - RATE_LIMIT_DEFAULT=${MEMORY_RATE_LIMIT_DEFAULT:-6000/minute}
      - READINESS_PROBE_TIMEOUT_SECONDS=${READINESS_PROBE_TIMEOUT_SECONDS:-3}
      - STARTUP_PROBE_TIMEOUT_SECONDS=${STARTUP_PROBE_TIMEOUT_SECONDS:-2}
      - SECURITY_HSTS_MAX_AGE_SECONDS=${SECURITY_HSTS_MAX_AGE_SECONDS:-63072000}
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_SERVICE_NAME=ascend-memory
      - OTEL_RESOURCE_ATTRIBUTES=service.version=0.1.4
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:${MEMORY_API_PORT:-7020}/health"]
      interval: 30s
      timeout: 5s
      start_period: 300s
      retries: 3
    # Memory sized from measured usage: this container is a thin REST/MCP
    # proxy to external Qdrant and embedding APIs, no local model loading,
    # observed at ~85M steady state (docker stats, 2026-09-04). 512M/128M
    # keeps roughly 4-6x headroom over that baseline.
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: false
    networks:
      default:
        aliases:
          - ascend-memory

  ascend-weather-mcp:
    build:
      context: ./apps/ascend-weather-mcp
      dockerfile: Dockerfile
    image: ascend-ai-ascend-weather-mcp:latest
    container_name: ascend-weather-mcp
    hostname: ascend-weather-mcp
    logging:
      driver: json-file
    restart: unless-stopped
    ports:
      - "${WEATHER_MCP_HOST_PORT:-9998}:9998"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - MANAGEMENT_OTLP_TRACING_ENDPOINT=${MANAGEMENT_OTLP_TRACING_ENDPOINT:-http://otel-collector:4318/v1/traces}
      - MANAGEMENT_TRACING_SAMPLING_PROBABILITY=${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:-1.0}
      - OTEL_SERVICE_NAME=ascend-weather-mcp
      - OTEL_RESOURCE_ATTRIBUTES=service.version=0.0.4
    # Memory sized from measured usage: peak observed at 374 MiB over 24h
    # (docker stats, 2026-09-04). The Dockerfile already pins heap to 70% of
    # this limit via JAVA_TOOL_OPTIONS, so this value and that heap setting
    # move together.
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      default:
        aliases:
          - ascend-weather-mcp

  ascend-audio-scribe:
    build:
      context: ./apps/ascend-audio-scribe
      dockerfile: Dockerfile
      additional_contexts:
        ascend-python-common: ./libs/ascend-python-common
    image: ascend-ai-ascend-audio-scribe:latest
    container_name: ascend-audio-scribe
    hostname: ascend-audio-scribe
    logging:
      driver: json-file
    restart: unless-stopped
    ports:
      - "${AUDIO_SCRIBE_API_PORT:-7017}:${AUDIO_SCRIBE_API_PORT:-7017}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - HF_HOME=/hf-cache
      - HF_TOKEN=${HF_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # SSRF guard: the host-published object store (Floci) is reached via
      # the host-bound localhost address (host.docker.internal:9070); allow
      # the loopback aliases.
      - ALLOWED_PRIVATE_HOSTS=host.docker.internal,localhost,127.0.0.1
      # Enables file:// URIs jailed to /audio.
      - MCP_FILE_URI_ROOT=/audio
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${AUDIO_SCRIBE_API_PORT:-7017}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - REDIS_URL=${REDIS_URL:-redis://host.docker.internal:6379/0}
      - RATE_LIMIT_DEFAULT=${AUDIO_SCRIBE_RATE_LIMIT_DEFAULT:-600/minute}
      - RATE_LIMIT_TRANSCRIBE=${RATE_LIMIT_TRANSCRIBE:-60/minute}
      - READINESS_PROBE_TIMEOUT_SECONDS=${READINESS_PROBE_TIMEOUT_SECONDS:-3}
      - STARTUP_PROBE_TIMEOUT_SECONDS=${STARTUP_PROBE_TIMEOUT_SECONDS:-2}
      - SECURITY_HSTS_MAX_AGE_SECONDS=${SECURITY_HSTS_MAX_AGE_SECONDS:-63072000}
      - MCP_DOWNLOAD_TIMEOUT_SECONDS=${MCP_DOWNLOAD_TIMEOUT_SECONDS:-30}
      - FETCH_MAX_REDIRECT_HOPS=${AUDIO_SCRIBE_FETCH_MAX_REDIRECT_HOPS:-10}
      - OTEL_SDK_DISABLED=${OTEL_SDK_DISABLED:-false}
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
      - OTEL_SERVICE_NAME=ascend-audio-scribe
      - OTEL_RESOURCE_ATTRIBUTES=service.version=0.9.4
    volumes:
      - "${HF_CACHE_ROOT:-hf-cache}:/hf-cache"
      - "${ASCEND_AUDIO_SCRIBE_MEDIA_ROOT:-ascend-audio-scribe-media}:/audio"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:${AUDIO_SCRIBE_API_PORT:-7017}/health"]
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8192M
        reservations:
          cpus: "0.5"
          memory: 1024M
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    security_opt:
      - no-new-privileges:true
    networks:
      default:
        aliases:
          - ascend-audio-scribe

  # ─── Observability stack ───

  # Exposes per-container memory used vs. the deploy.resources.limits.memory
  # ceiling (container_memory_used_bytes / container_memory_limit_bytes) to
  # Prometheus, since neither JVM heap metrics nor Python RSS metrics see the
  # container's cgroup limit or its own non-heap overhead. First-party
  # exporter (source in infra/observability/container-metrics-exporter/): cAdvisor
  # was tried first and rejected because a containerd-backed image store
  # never populates the legacy overlayfs layerdb metadata
  # cAdvisor's docker handler requires, so it silently reports only the host
  # root cgroup. This exporter reads only the Docker Engine API stats
  # endpoint over the socket, so it needs no /sys or /var/lib/docker mount
  # and no privileged mode, only group-read access to the socket.
  container-metrics-exporter:
    build:
      context: ./infra/observability/container-metrics-exporter
    image: ascend-ai-container-metrics-exporter:latest
    container_name: container-metrics-exporter
    hostname: container-metrics-exporter
    restart: unless-stopped
    group_add:
      - "${DOCKER_SOCKET_GID:-0}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      default:
        aliases:
          - container-metrics-exporter

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    container_name: prometheus
    hostname: prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_HOST_PORT:-7077}:9090"
    environment:
      - PROMETHEUS_SCRAPE_INTERVAL=${PROMETHEUS_SCRAPE_INTERVAL:-15s}
      - PROMETHEUS_EVALUATION_INTERVAL=${PROMETHEUS_EVALUATION_INTERVAL:-15s}
      - OBSERVABILITY_CLUSTER_LABEL=${OBSERVABILITY_CLUSTER_LABEL:-ascend-ai-local}
      - PROMETHEUS_QDRANT_TARGET=${PROMETHEUS_QDRANT_TARGET:-host.docker.internal:6333}
    entrypoint: ["/etc/prometheus/price-rules.sh"]
    command:
      - --config.file=/prometheus/prometheus.yaml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-72h}
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ./infra/observability/prometheus/price-rules.sh:/etc/prometheus/price-rules.sh:ro
      - ./infra/observability/grafana/dashboards/pricing.yaml:/etc/prometheus/pricing.yaml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - prometheus

  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_HOST_PORT:-7078}:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:7078}
      - PROMETHEUS_SCRAPE_INTERVAL=${PROMETHEUS_SCRAPE_INTERVAL:-15s}
      - GRAFANA_LOKI_MAX_LINES=${GRAFANA_LOKI_MAX_LINES:-1000}
      - GRAFANA_DASHBOARDS_UPDATE_INTERVAL_SECONDS=${GRAFANA_DASHBOARDS_UPDATE_INTERVAL_SECONDS:-30}
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      default:
        aliases:
          - grafana

  loki:
    image: grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193
    container_name: loki
    hostname: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki-config.yaml
      - -config.expand-env=true
    environment:
      - LOKI_RETENTION_PERIOD=${LOKI_RETENTION_PERIOD:-2160h}
      - LOKI_RETENTION_DELETE_DELAY=${LOKI_RETENTION_DELETE_DELAY:-2h}
      - LOKI_RESULTS_CACHE_MAX_SIZE_MB=${LOKI_RESULTS_CACHE_MAX_SIZE_MB:-100}
    volumes:
      - ./infra/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      default:
        aliases:
          - loki

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    container_name: otel-collector
    hostname: otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector/otel-collector-config.yaml"]
    user: "0"
    environment:
      - COLLECTOR_MEMORY_CHECK_INTERVAL=${COLLECTOR_MEMORY_CHECK_INTERVAL:-1s}
      - COLLECTOR_MEMORY_LIMIT_MIB=${COLLECTOR_MEMORY_LIMIT_MIB:-256}
      - COLLECTOR_MEMORY_SPIKE_LIMIT_MIB=${COLLECTOR_MEMORY_SPIKE_LIMIT_MIB:-64}
      - COLLECTOR_BATCH_TIMEOUT=${COLLECTOR_BATCH_TIMEOUT:-1s}
      - COLLECTOR_BATCH_SIZE=${COLLECTOR_BATCH_SIZE:-1024}
    volumes:
      - ./infra/observability/otel-collector/otel-collector-config.yaml:/etc/otel-collector/otel-collector-config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      default:
        aliases:
          - otel-collector

  tempo:
    image: grafana/tempo:3.1.0@sha256:3076b8dcdfb32fd6bc5ccef85e7b7313e6199b9cb84366257fc17ecb696db5fd
    container_name: tempo
    hostname: tempo
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo/tempo-config.yaml
      - -config.expand-env=true
    environment:
      - TEMPO_BLOCK_RETENTION=${TEMPO_BLOCK_RETENTION:-2160h}
      - TEMPO_LOG_LEVEL=${TEMPO_LOG_LEVEL:-info}
      - TEMPO_MAX_BLOCK_DURATION=${TEMPO_MAX_BLOCK_DURATION:-5m}
      - TEMPO_SEARCH_DURATION_SLO=${TEMPO_SEARCH_DURATION_SLO:-5s}
      - TEMPO_SEARCH_THROUGHPUT_BYTES_SLO=${TEMPO_SEARCH_THROUGHPUT_BYTES_SLO:-1073741824}
      - TEMPO_TRACE_BY_ID_DURATION_SLO=${TEMPO_TRACE_BY_ID_DURATION_SLO:-5s}
      - OBSERVABILITY_CLUSTER_LABEL=${OBSERVABILITY_CLUSTER_LABEL:-ascend-ai-local}
    volumes:
      - ./infra/observability/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
      - tempo-data:/var/tempo
    networks:
      default:
        aliases:
          - tempo

  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0@sha256:6ca518a72f30f7f576ef92963de1b91d3c3f5fd3aeac949f878bfda183587820
    container_name: redis-exporter
    hostname: redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=${REDIS_ADDR:-redis://host.docker.internal:6379}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - redis-exporter

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    container_name: postgres-exporter
    hostname: postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_URI=${DATA_SOURCE_URI:-host.docker.internal:5432/ascend_ai?sslmode=disable}
      - DATA_SOURCE_USER=${DATA_SOURCE_USER}
      - DATA_SOURCE_PASS=${DATA_SOURCE_PASS}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        aliases:
          - postgres-exporter

volumes:
