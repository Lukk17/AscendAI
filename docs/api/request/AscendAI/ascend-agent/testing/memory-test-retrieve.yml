info:
  name: memory-test-retrieve
  type: http
  seq: 2

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:9917/api/v1/ai/prompt"
  headers:
    - name: X-User-Id
      value: frostySemanticMemoryTest
  body:
    type: multipart-form
    data:
      - name: prompt
        type: text
        value: What is my name and what do I do?
      - name: image
        type: file
        value: []
        disabled: true
      - name: document
        type: file
        value: []
        disabled: true
      - name: embeddingProvider
        type: text
        value: openai
      - name: provider
        type: text
        value: minimax
      - name: model
        type: text
        value: MiniMax-M2.7
      - name: provider
        type: text
        value: anthropic
        disabled: true
      - name: model
        type: text
        value: claude-sonnet-4-6
        disabled: true
      - name: embeddingProvider
        type: text
        value: lmstudio
        disabled: true
      - name: embeddingProvider
        type: text
        value: gemini
        disabled: true

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Recall content carries both memorised facts and is not a refusal", function () {
            const content = res.getBody().content;
            expect(content).to.be.a("string").and.not.empty;
            expect(content).to.include("Luke");
            expect(content.toLowerCase()).to.include("software engineer");
            expect(content.toLowerCase()).to.not.include("i don't know your name");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
