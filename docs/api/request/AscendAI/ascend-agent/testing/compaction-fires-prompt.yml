info:
  name: compaction-fires-prompt
  type: http
  seq: 15

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:9917/api/v1/ai/prompt"
  headers:
    - name: X-User-Id
      value: frostyCompactionFiresTest
  body:
    type: multipart-form
    data:
      - name: prompt
        type: text
        value: Briefly summarise everything I've told you about myself so far.
      - name: provider
        type: text
        value: anthropic
      - name: model
        type: text
        value: claude-sonnet-4-6
      - name: embeddingProvider
        type: text
        value: openai

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Response is a normal chat completion", function () {
            const content = res.getBody().content;
            expect(content).to.be.a("string").and.not.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
