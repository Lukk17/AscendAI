info:
  name: attach-sources-prompt
  type: http
  seq: 10

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:9917/api/v1/ai/prompt"
  headers:
    - name: X-User-Id
      value: frostyAttachSourcesTest
  body:
    type: multipart-form
    data:
      - name: prompt
        type: text
        value: How long should I rest the pierogi dough according to Babcia Helena's recipe?
      - name: attachSources
        type: text
        value: "true"
      - name: provider
        type: text
        value: anthropic
      - name: model
        type: text
        value: claude-sonnet-4-6
      - name: embeddingProvider
        type: text
        value: openai

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("sources carries a presigned host-reachable download URL", function () {
            const body = res.getBody();
            expect(body.sources).to.be.an("array").with.length.of.at.least(1);
            const source = body.sources[0];
            expect(source.name).to.be.a("string").and.not.empty;
            expect(source.mimeType).to.be.a("string").and.not.empty;
            expect(source.downloadUrl).to.be.a("string").and.not.empty;
            expect(source.expiresAt).to.be.a("string").and.not.empty;
            expect(source.downloadUrl).to.match(/^https?:\/\/localhost:9070\//);
            expect(source.downloadUrl).to.not.include("host.docker.internal");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
