info:
  name: rag-ingestion-run
  type: http
  seq: 8

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:9917/api/v1/ingestion/run?embeddingProvider=openai"
  headers:
    - name: X-User-Id
      value: frostyRagTest
  params:
    - name: prefix
      value: documents/
      type: query
      disabled: true
    - name: prefix
      value: markdown/
      type: query
      disabled: true
    - name: embeddingProvider
      value: lmstudio
      type: query
      disabled: true
    - name: embeddingProvider
      value: openai
      type: query
    - name: embeddingProvider
      value: gemini
      type: query
      disabled: true
  body:
    type: multipart-form

runtime:
  variables:
    - name: ragMinIndexed
      value: "1"
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Ingestion indexes at least ragMinIndexed fixtures with no failures", function () {
            const minIndexed = Number(bru.getEnvVar("ragMinIndexed") || bru.getRequestVar("ragMinIndexed"));
            expect(Number.isInteger(minIndexed) && minIndexed >= 1, "ragMinIndexed is a positive integer").to.be.true;
            const body = res.getBody();
            expect(body.indexed).to.be.a("number");
            expect(body.indexed).to.be.at.least(minIndexed);
            expect(body.failed).to.equal(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
