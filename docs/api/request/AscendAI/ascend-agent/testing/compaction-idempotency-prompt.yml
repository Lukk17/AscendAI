info:
  name: compaction-idempotency-prompt
  type: http
  seq: 16

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:9917/api/v1/ai/prompt"
  headers:
    - name: X-User-Id
      value: frostyCompactionIdempotencyTest
  body:
    type: multipart-form
    data:
      - name: prompt
        type: text
        value: One more thing — can you also tell me the name of my dog and where he was rescued from?
      - name: provider
        type: text
        value: anthropic
      - name: model
        type: text
        value: claude-sonnet-4-6
      - name: embeddingProvider
        type: text
        value: openai

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Response is a normal chat completion", function () {
            const content = res.getBody().content;
            expect(content).to.be.a("string").and.not.empty;
        });
        test("Response references the seeded facts: Rex the beagle rescued from a Praga shelter", function () {
            const lower = res.getBody().content.toLowerCase();
            expect(lower).to.include("rex");
            expect(lower).to.include("praga");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
