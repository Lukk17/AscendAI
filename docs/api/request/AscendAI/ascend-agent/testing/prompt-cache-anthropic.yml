info:
  name: prompt-cache-anthropic
  type: http
  seq: 14

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:9917/api/v1/ai/prompt"
  headers:
    - name: X-User-Id
      value: frostyPromptCacheAnthropicTest
  body:
    type: multipart-form
    data:
      - name: prompt
        type: text
        value: |
          Please write a short, structured technical paragraph (about 200 words)
          describing the high-level architecture of a typical Spring Boot
          microservice that uses PostgreSQL for persistence, Redis for caching,
          and Kafka for asynchronous messaging. Cover the main layers
          (controller, service, repository), the typical request lifecycle, and
          a couple of cross-cutting concerns (logging, metrics, tracing). Keep
          the answer self-contained and consistent run-to-run.
      - name: provider
        type: text
        value: anthropic
      - name: model
        type: text
        value: claude-sonnet-4-6
      - name: embeddingProvider
        type: text
        value: openai

runtime:
  variables:
    - name: promptCacheStep
      value: "1"
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Step 1 proves cache_control was accepted, step 2 proves a cache read", function () {
            const step = String(bru.getEnvVar("promptCacheStep") || bru.getRequestVar("promptCacheStep"));
            expect(["1", "2"], "promptCacheStep").to.include(step);
            const body = res.getBody();
            expect(body.content).to.be.a("string").and.not.empty;
            const usage = body.metadata.usage;
            expect(usage).to.be.an("object");
            const nativeUsage = usage.nativeUsage;
            expect(nativeUsage).to.be.an("object");
            expect(nativeUsage.cache_creation_input_tokens).to.be.a("number");
            expect(nativeUsage.cache_read_input_tokens).to.be.a("number");
            if (step === "2") {
                expect(nativeUsage.cache_read_input_tokens).to.be.above(0);
            } else {
                expect(nativeUsage.cache_creation_input_tokens > 0 || nativeUsage.cache_read_input_tokens > 0).to.be.true;
            }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
