info:
  name: rag-dedup-prompt
  type: http
  seq: 12

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:9917/api/v1/ai/prompt"
  headers:
    - name: X-User-Id
      value: frostyRagDedupTest
  body:
    type: multipart-form
    data:
      - name: prompt
        type: text
        value: How do I make pierogi? Compare any two recipes you have access to.
      - name: attachSources
        type: text
        value: "true"
      - name: provider
        type: text
        value: anthropic
      - name: model
        type: text
        value: claude-sonnet-4-6
      - name: embeddingProvider
        type: text
        value: openai

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("sources dedups to exactly one entry per unique source file", function () {
            const body = res.getBody();
            expect(body.sources).to.be.an("array").with.lengthOf(2);
            const urls = body.sources.map(function (s) { return s.downloadUrl; });
            const hasHelena = urls.some(function (u) { return u.includes("markdown/dedup-pierogi-helena.md"); });
            const hasGrandma = urls.some(function (u) { return u.includes("markdown/dedup-pierogi-grandma.md"); });
            expect(hasHelena).to.be.true;
            expect(hasGrandma).to.be.true;
            const names = body.sources.map(function (s) { return s.name; });
            expect(names).to.include("Babcia Helena's pierogi recipe (e2e dedup fixture)");
            expect(names).to.include("Grandma Maria's pierogi recipe (e2e dedup fixture)");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
