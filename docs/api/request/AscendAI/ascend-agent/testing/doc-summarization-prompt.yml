info:
  name: doc-summarization-prompt
  type: http
  seq: 5

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:9917/api/v1/ai/prompt"
  headers:
    - name: X-User-Id
      value: frostySummarizationTest
  body:
    type: multipart-form
    data:
      - name: document
        type: file
        value:
          - "{{ascendAgentFixtures}}/argent-saga-chronicle.pdf"
        contentType: file
      - name: prompt
        type: text
        value: Summarize the key points in this document
      - name: provider
        type: text
        value: openai
        disabled: true
      - name: model
        type: text
        value: gpt-4o
        disabled: true
      - name: embeddingProvider
        type: text
        value: openai
      - name: provider
        type: text
        value: minimax
      - name: model
        type: text
        value: MiniMax-M2.7
      - name: provider
        type: text
        value: anthropic
        disabled: true
      - name: model
        type: text
        value: claude-sonnet-4-6
        disabled: true

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Summary quotes at least 3 facts from the parsed PDF", function () {
            const content = res.getBody().content;
            expect(content).to.be.a("string").and.not.empty;
            const facts = ["Aenaria Solveh", "Halen Veyr", "4317 P.E.", "Heron's Tooth", "thrall-burn", "57 seconds", "Concord of Mireth", "412 A.E.", "Vorsh-Ka the Quiet", "81 duels", "Iren Hask", "498 A.E."];
            const hits = facts.filter(function (f) { return content.includes(f); });
            expect(hits.length).to.be.at.least(3);
            const lower = content.toLowerCase();
            expect(lower).to.not.include("the document context block is empty");
            expect(lower).to.not.include("i don't see a document attached");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
