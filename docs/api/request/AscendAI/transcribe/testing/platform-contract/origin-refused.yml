info:
  name: origin-refused
  type: http
  seq: 108

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7017/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
    - name: Origin
      value: https://attacker.example
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 108,
        "method": "initialize",
        "params": {
          "protocolVersion": "2025-06-18",
          "capabilities": {},
          "clientInfo": {
            "name": "bruno-platform-contract",
            "version": "0.1.0"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 4xx", function () {
            expect(res.getStatus()).to.be.within(400, 499);
        });
        test("no mcp-session-id response header", function () {
            expect(res.getHeader("mcp-session-id")).to.equal(undefined);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
