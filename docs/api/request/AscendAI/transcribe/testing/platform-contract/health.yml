info:
  name: health
  type: http
  seq: 1

http:
  method: GET
  url: "{{protocol}}://{{baseUrl}}:7017/health"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("status is ok", function () {
            expect(res.getBody().status).to.equal("ok");
        });
        test("service is ascend-audio-scribe", function () {
            expect(res.getBody().service).to.equal("ascend-audio-scribe");
        });
        test("version is a non-empty string", function () {
            expect(res.getBody().version).to.be.a("string").and.not.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
