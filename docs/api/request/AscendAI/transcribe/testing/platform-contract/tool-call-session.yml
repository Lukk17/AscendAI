info:
  name: tool-call-session
  type: http
  seq: 104

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7017/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 104,
        "method": "tools/call",
        "params": {
          "name": "health",
          "arguments": {}
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("no mcp-session-id response header in stateless mode", function () {
            expect(res.getHeader("mcp-session-id")).to.equal(undefined);
        });
        test("content and structured content match the pin", function () {
            const sseBody = res.getBody();
            const dataLine = String(sseBody).split("\n").find(function (line) { return line.indexOf("data:") === 0; });
            const envelope = JSON.parse(dataLine.replace(/^data:\s*/, ""));
            const result = envelope.result;
            const expected = { status: "ok" };
            expect(JSON.parse(result.content[0].text)).to.eql(expected);
            expect(result.structuredContent).to.eql(expected);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
