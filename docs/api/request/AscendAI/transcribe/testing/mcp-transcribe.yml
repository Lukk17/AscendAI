info:
  name: mcp-transcribe
  type: http
  seq: 5

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7017/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
    - name: Mcp-Session-Id
      value: "{{mcp_session_id}}"
    - name: MCP-Protocol-Version
      value: "{{mcp_protocol_version}}"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 1,
        "method": "tools/call",
        "params": {
          "name": "transcribe_openai",
          "arguments": {
            "audio_uri": "http://host.docker.internal:9070/e2e-fixtures/meeting-clip.wav",
            "model": "whisper-1",
            "language": "en"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("transcribe_openai tool call carries the canary transcription", function () {
            const sseBody = res.getBody();
            const dataLine = String(sseBody).split("\n").find(function (line) { return line.indexOf("data:") === 0; });
            const envelope = JSON.parse(dataLine.replace(/^data:\s*/, ""));
            const result = envelope.result;
            expect(result.isError === undefined || result.isError === false).to.be.true;
            expect(result.content).to.be.an("array").with.lengthOf(1);
            expect(result.content[0].type).to.equal("text");
            expect(result.content[0].text).to.be.a("string").and.not.empty;
            const payload = JSON.parse(result.content[0].text);
            expect(payload.source).to.equal("openai");
            expect(payload.model).to.equal("whisper-1");
            expect(payload.language).to.equal("en");
            expect(payload.transcription).to.be.a("string").and.not.empty;
            const lower = payload.transcription.toLowerCase();
            const canaries = ["q3", "acme", "adam", "friday", "migration"];
            expect(canaries.some(function (c) { return lower.includes(c); })).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
