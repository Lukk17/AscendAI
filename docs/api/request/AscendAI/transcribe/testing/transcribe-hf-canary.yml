info:
  name: transcribe-hf-canary
  type: http
  seq: 3

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7017/api/v1/transcribe/hf"
  headers:
    - name: accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - "{{audioScribeFixtures}}/meeting-clip.wav"
      - name: model
        type: text
        value: openai/whisper-large-v3
      - name: hf_provider
        type: text
        value: hf-inference
      - name: stream
        type: text
        value: "false"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Content-Type starts with text/markdown", function () {
            expect(res.getHeader("content-type")).to.match(/^text\/markdown/);
        });
        test("Content-Disposition names transcript_hf.md", function () {
            expect(res.getHeader("content-disposition")).to.equal("attachment; filename=\"transcript_hf.md\"");
        });
        test("Transcript body carries the canary phrase", function () {
            const body = String(res.getBody());
            expect(body.length).to.be.at.least(5);
            const lower = body.toLowerCase();
            const canaries = ["q3", "acme", "adam", "friday", "migration"];
            expect(canaries.some(function (c) { return lower.includes(c); })).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
