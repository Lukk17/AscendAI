info:
  name: transcribe-invalid-no-file
  type: http
  seq: 1

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7017/api/v1/transcribe/openai"
  headers:
    - name: accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: model
        type: text
        value: whisper-1
      - name: language
        type: text
        value: en
      - name: stream
        type: text
        value: "false"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 422", function () {
            expect(res.getStatus()).to.equal(422);
        });
        test("Content-Type starts with application/json", function () {
            expect(res.getHeader("content-type")).to.match(/^application\/json/);
        });
        test("detail is a non-empty array naming the missing file field", function () {
            const body = res.getBody();
            expect(body.detail).to.be.an("array").that.is.not.empty;
            const fileError = body.detail.find(function (d) { return Array.isArray(d.loc) && d.loc.includes("file"); });
            expect(fileError).to.be.ok;
            expect(fileError.type).to.include("missing");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
