info:
  name: transcribe-invalid-no-file
  type: http
  seq: 1

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7017/api/v1/transcribe/openai"
  headers:
    - name: accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: model
        type: text
        value: whisper-1
      - name: language
        type: text
        value: en
      - name: stream
        type: text
        value: "false"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("A submission with no file is rejected with the validation code", function () {
            expect(res.getStatus()).to.equal(400);
        });
        test("Content-Type is application/problem+json", function () {
            expect(res.getHeader("content-type")).to.include("application/problem+json");
        });
        test("The body is the problem body with the validation code", function () {
            const body = res.getBody();
            expect(body.code).to.equal("validation");
            expect(body.detail).to.be.a("string").and.not.empty;
        });
        test("The errors array names the missing file field", function () {
            const body = res.getBody();
            expect(body.errors).to.be.an("array").that.is.not.empty;
            const fields = body.errors.map(function (entry) { return entry.field; });
            expect(fields).to.include("file");
            body.errors.forEach(function (entry) {
                expect(entry.message).to.be.a("string").and.not.empty;
            });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
