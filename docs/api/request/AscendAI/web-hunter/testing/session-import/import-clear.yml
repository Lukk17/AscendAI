info:
  name: import-clear
  type: http
  seq: 42

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/session/clear"
  body:
    type: json
    data: |-
      {
        "url": "https://www.example.net/",
        "profile": "e2e-import"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("imported session clears like any other", function () {
            const b = res.getBody();
            expect(b.status).to.equal("cleared");
            expect(b.existed).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
