info:
  name: extract-tier-cloudflare
  type: http
  seq: 9

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    # A genuine Cloudflare challenge page (the curl tier is blocked). A browser tier either
    # solves it and returns the page, or the site rates this address and the service answers
    # 428 with the human-help body; both prove the browser-tier path and neither returns the
    # block page as content.
    data: |-
      {
        "url": "https://www.scrapingcourse.com/cloudflare-challenge",
        "include_links": false,
        "heavy_mode": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("the read is answered, solved or gated", function () {
            const st = res.getStatus();
            expect([200, 428]).to.include(st);
        });
        test("Cloudflare tier: solved page or human help, never the block page", function () {
            const st = res.getStatus();
            const b = res.getBody();
            if (st === 428) {
                expect(b.code).to.equal("human_intervention_required");
                expect(b.vnc_url).to.be.a("string").and.not.empty;
                return;
            }
            expect(b.status).to.equal("success");
            const content = (b.content || b.text || b.markdown || "").toLowerCase();
            expect(content.length).to.be.at.least(50);
            expect(content).to.include("cloudflare challenge");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
