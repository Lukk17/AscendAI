info:
  name: errors-counter-before
  type: http
  seq: 3

http:
  method: GET
  url: "{{protocol}}://{{baseUrl}}:7021/metrics"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        function findCounter(text, want) {
            var result = 0;
            String(text).split("\n").forEach(function (line) {
                if (line.indexOf("ascend_service_errors_total{") !== 0) { return; }
                var m = line.match(/^ascend_service_errors_total\{([^}]*)\}\s+([0-9.eE+\-]+)/);
                if (!m) { return; }
                var labels = m[1];
                var ok = Object.keys(want).every(function (k) {
                    return labels.indexOf(k + '="' + want[k] + '"') !== -1;
                });
                if (ok) { result = parseFloat(m[2]); }
            });
            return result;
        }
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("stores the not_found rest unmatched counter", function () {
            var value = findCounter(res.getBody(), {code: "not_found", surface: "rest", operation: "unmatched"});
            bru.setVar("pcNotFoundBefore", value);
            expect(value).to.be.a("number").at.least(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
