info:
  name: oversized-body
  type: http
  seq: 109

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
  body:
    type: json
    data: |-
      {}
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const padding = "x".repeat(5 * 1024 * 1024);
        req.setBody({
          jsonrpc: "2.0",
          id: 109,
          method: "initialize",
          params: {
            protocolVersion: "2025-06-18",
            capabilities: {},
            clientInfo: { name: "bruno-platform-contract", version: "0.1.0" },
            padding: padding
          }
        });
    - type: tests
      code: |-
        test("Status code is 413", function () {
            expect(res.getStatus()).to.equal(413);
        });
        test("no mcp-session-id response header", function () {
            expect(res.getHeader("mcp-session-id")).to.equal(undefined);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
