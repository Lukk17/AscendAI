info:
  name: health-foreign-host
  type: http
  seq: 107

http:
  method: GET
  url: "{{protocol}}://{{baseUrl}}:7021/health"
  headers:
    - name: Host
      value: attacker.example
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200 even with a foreign Host header", function () {
            expect(res.getStatus()).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
