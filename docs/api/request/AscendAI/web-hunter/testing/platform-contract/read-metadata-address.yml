info:
  name: read-metadata-address
  type: http
  seq: 14

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    data: |-
      {
          "url": "http://169.254.169.254/latest/meta-data",
          "include_links": false,
          "heavy_mode": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 400", function () {
            expect(res.getStatus()).to.equal(400);
        });
        test("code is unsafe_uri", function () {
            expect(res.getBody().code).to.equal("unsafe_uri");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
