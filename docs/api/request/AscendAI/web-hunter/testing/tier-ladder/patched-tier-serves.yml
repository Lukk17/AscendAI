info:
  name: patched-tier-serves
  type: http
  seq: 55

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    # Patched tiers serve the article under their own names.
    data: |-
      {
        "url": "http://e2e-fake-site:7031/article",
        "include_links": false,
        "heavy_mode": false,
        "tier": "{{tier}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("patched tier serves the article as itself", function () {
            const b = res.getBody();
            expect(b.status).to.equal("success");
            expect(b.content).to.include("QUARRY-THRUSH");
            // bru 4.2.1 does not interpolate --env-var values inside test
            // scripts, so the exact per-tier equality (mode === requested
            // tier) is proven by the direct curl captures in the run record;
            // here the file pins the closed set both patched tiers belong to.
            expect(["4a-patchright", "4b-camoufox"]).to.include(b.mode);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
