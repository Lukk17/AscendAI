info:
  name: search-stable-query
  type: http
  seq: 4

http:
  method: GET
  url: "{{protocol}}://{{baseUrl}}:7021/api/v1/web/search?query=OpenStreetMap&limit=3"
  params:
    - name: query
      value: OpenStreetMap
      type: query
    - name: limit
      value: "3"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("search returns a JSON array of 1 to 3 results", function () {
            const body = res.getBody();
            const data = typeof body === "string" ? JSON.parse(body) : body;
            expect(data).to.be.an("array");
            expect(data.length).to.be.within(1, 3);
        });
        test("every result carries title, url and content", function () {
            const data = res.getBody();
            data.forEach(function (entry) {
                expect(entry.title).to.be.a("string").and.not.empty;
                expect(entry.url).to.be.a("string").and.match(/^https?:\/\//);
                expect(entry.content).to.be.a("string");
            });
        });
        test("at least one result mentions openstreetmap", function () {
            const data = res.getBody();
            const hit = data.some(function (entry) {
                return (entry.title + " " + entry.content).toLowerCase().includes("openstreetmap");
            });
            expect(hit).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
