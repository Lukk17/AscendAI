info:
  name: captcha-clearance-reuse
  type: http
  seq: 19

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    # Spec 11 Call 2: read the democaptcha hCaptcha demo form again after the human solved it
    # through NoVNC and the monitor captured the session under session:democaptcha.com:default.
    # No profile field, so the read resolves to the default profile the capture landed under.
    # The reader sees the stored session and routes the read onto the browser tier with the
    # saved cookies, so this call must answer 200 success, never a second 428.
    data: |-
      {
        "url": "https://democaptcha.com/demo-form-eng/hcaptcha.html",
        "include_links": false,
        "heavy_mode": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("reuse: HTTP 200, no second intervention", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("reuse: status is success (stored session replayed via browser tier)", function () {
            expect(res.getBody().status).to.equal("success");
        });
        test("reuse: a content-carrying field holds at least 50 characters", function () {
            const body = res.getBody();
            const data = typeof body === "string" ? JSON.parse(body) : body;
            const contentField = ["content", "text", "markdown"].find(function (field) { return typeof data[field] === "string"; });
            expect(contentField, "content-carrying string field").to.be.a("string");
            expect(data[contentField].length).to.be.at.least(50);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
