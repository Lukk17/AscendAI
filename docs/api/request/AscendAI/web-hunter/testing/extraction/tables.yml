info:
  name: tables
  type: http
  seq: 23

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    data: |-
      {
        "url": "http://e2e-fake-site:7031/tables",
        "include_links": false,
        "heavy_mode": false,
        "output_format": "tables"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("tables match the fixture rows cell for cell", function () {
            const b = res.getBody();
            expect(b.status).to.equal("success");
            expect(b.tables).to.deep.equal([
              [["SKU-1147", "Cinder Sparrow feeder", "23.50"], ["SKU-2203", "Lumen Badger hutch", "89.99"], ["SKU-3318", "Helix Finch perch", "12.75"]]
            ]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
