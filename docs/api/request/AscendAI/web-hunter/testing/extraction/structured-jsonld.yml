info:
  name: structured-jsonld
  type: http
  seq: 22

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    data: |-
      {
        "url": "http://e2e-fake-site:7031/product",
        "include_links": false,
        "heavy_mode": false,
        "output_format": "structured"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("structured product carries the article fields and the JSON-LD canary", function () {
            const b = res.getBody();
            expect(b.status).to.equal("success");
            expect(b.content).to.include("Brassbound Meridian Astrolabe");
            expect(b.metadata["json-ld"][0].name).to.equal("Brassbound Meridian Astrolabe");
            expect(b.metadata["json-ld"][0].offers.price).to.equal(847.25);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
