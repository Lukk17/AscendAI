info:
  name: route-audio
  type: http
  seq: 27

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    data: |-
      {
        "url": "http://e2e-fake-site:7031/files/canary.mp3",
        "include_links": false,
        "heavy_mode": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("routed audio returns a transcript holding the invented word", function () {
            const b = res.getBody();
            expect(b.content).to.include("KAKSMA");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
