info:
  name: search-overlong-query
  type: http
  seq: 3

http:
  method: GET
  url: "{{protocol}}://{{baseUrl}}:7021/api/v1/web/search?&limit=3"
  params:
    - name: query
      value: ""
      type: query
    - name: limit
      value: "3"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 400", function () {
            expect(res.getStatus()).to.equal(400);
        });
        test("detail field mentions maximum length constraint", function () {
            expect(res.getBody().detail).to.include("query exceeds maximum length");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
