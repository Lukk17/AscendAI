info:
  name: extract-example-com
  type: http
  seq: 5

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    data: |-
      {
        "url": "https://www.example.com/",
        "include_links": false,
        "heavy_mode": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("extract returns structured content", function () {
            const body = res.getBody();
            const data = typeof body === "string" ? JSON.parse(body) : body;
            expect(data).to.have.property("status").or.have.property("content").or.have.property("text");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
