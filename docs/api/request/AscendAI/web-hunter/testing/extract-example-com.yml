info:
  name: extract-example-com
  type: http
  seq: 5

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    data: |-
      {
        "url": "https://www.example.com/",
        "include_links": false,
        "heavy_mode": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("read of example.com succeeds and carries the canary phrase", function () {
            const body = res.getBody();
            const data = typeof body === "string" ? JSON.parse(body) : body;
            expect(data.url).to.equal("https://www.example.com/");
            expect(data.status).to.equal("success");
            const contentField = ["content", "text", "markdown"].find(function (field) { return typeof data[field] === "string"; });
            expect(contentField, "content-carrying string field").to.be.a("string");
            expect(data[contentField].length).to.be.at.least(50);
            expect(data[contentField].toLowerCase()).to.include("example domain");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
