info:
  name: search-missing-query
  type: http
  seq: 2

http:
  method: GET
  url: "{{protocol}}://{{baseUrl}}:7021/api/v1/web/search?limit=3"
  params:
    - name: limit
      value: "3"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 400", function () {
            expect(res.getStatus()).to.equal(400);
        });
        test("validation body names the missing query field", function () {
            const body = res.getBody();
            expect(body.code).to.equal("validation");
            expect(body.errors).to.be.an("array");
            const queryError = body.errors.find(e => e.field === "query");
            expect(queryError, "validation error for 'query' field not found").to.exist;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
