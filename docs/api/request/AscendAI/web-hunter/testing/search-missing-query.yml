info:
  name: search-missing-query
  type: http
  seq: 2

http:
  method: GET
  url: "{{protocol}}://{{baseUrl}}:7021/api/v1/web/search?limit=3"
  params:
    - name: limit
      value: "3"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 422", function () {
            expect(res.getStatus()).to.equal(422);
        });
        test("detail array contains missing-field error for query", function () {
            const detail = res.getBody().detail;
            expect(detail).to.be.an("array");
            const queryError = detail.find(e => e.type === "missing" && e.loc && e.loc.includes("query"));
            expect(queryError, "missing error for 'query' field not found").to.exist;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
