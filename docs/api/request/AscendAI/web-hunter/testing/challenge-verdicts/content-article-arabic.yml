info:
  name: content-article-arabic
  type: http
  seq: 77

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    data: |-
      {
        "url": "http://e2e-fake-site:7031/article-ar",
        "include_links": false,
        "heavy_mode": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("arabic article is content with its canary", function () {
            const b = res.getBody();
            expect(b.status).to.equal("success");
            expect(b.content).to.include("سجل مسح QUARRY-THRUSH 47 زوجا معششا.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
