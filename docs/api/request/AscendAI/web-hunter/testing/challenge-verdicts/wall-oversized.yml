info:
  name: wall-oversized
  type: http
  seq: 74

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    data: |-
      {
        "url": "http://e2e-fake-site:7031/wall-oversized",
        "include_links": false,
        "heavy_mode": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 428", function () {
            expect(res.getStatus()).to.equal(428);
        });
        test("oversized wall answers with a vnc_url", function () {
            const b = res.getBody();
            expect(b.code).to.equal("human_intervention_required");
            expect(b.status).to.equal(428);
            expect(b.vnc_url).to.be.a("string").and.not.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
