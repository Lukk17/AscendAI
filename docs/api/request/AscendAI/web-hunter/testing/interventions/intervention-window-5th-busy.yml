info:
  name: intervention-window-5th-busy
  type: http
  seq: 62

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    # Fifth profile while four windows are open: the cap answers 409.
    data: |-
      {
        "url": "http://e2e-fake-site:7031/turnstile-wall",
        "include_links": false,
        "heavy_mode": false,
        "profile": "e2e-w5"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 409", function () {
            expect(res.getStatus()).to.equal(409);
        });
        test("busy window names the four held flows", function () {
            const b = res.getBody();
            expect(b.code).to.equal("novnc_busy");
            expect(b.active_flows).to.equal(4);
            expect(b.max_concurrent_flows).to.equal(4);
            expect(b.flows).to.be.an("array").with.lengthOf(4);
        });
        test("the holder is the oldest flow, the e2e-w1 window", function () {
            const b = res.getBody();
            expect(b.holder_profile).to.equal("e2e-w1");
            expect(b.holder_url).to.equal("http://e2e-fake-site:7031/turnstile-wall");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
