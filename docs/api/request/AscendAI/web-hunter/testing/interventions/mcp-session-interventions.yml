info:
  name: mcp-session-interventions
  type: http
  seq: 64

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
    - name: Mcp-Session-Id
      value: "{{mcp_session_id}}"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 1,
        "method": "tools/call",
        "params": {
          "name": "session_interventions",
          "arguments": {}
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("MCP listing mirrors the REST flows", function () {
            const sseBody = res.getBody();
            const dataLine = String(sseBody).split("\n").find(function (line) { return line.indexOf("data:") === 0; });
            const envelope = JSON.parse(dataLine.replace(/^data:\s*/, ""));
            const result = envelope.result;
            expect(result.isError === undefined || result.isError === false, "result.isError").to.be.true;
            let payload = result.structuredContent;
            if (payload && payload.result) {
                payload = payload.result;
            } else {
                const textEntry = result.content.find(function (entry) { return entry.type === "text"; });
                payload = JSON.parse(textEntry.text);
            }
            expect(payload.active_flows).to.be.a("number");
            expect(payload.flows).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
