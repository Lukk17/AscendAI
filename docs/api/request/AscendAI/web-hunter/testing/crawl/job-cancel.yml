info:
  name: job-cancel
  type: http
  seq: 33

http:
  method: DELETE
  url: "{{protocol}}://{{baseUrl}}:7021/api/v1/crawl/jobs/{{job_id}}"
  headers:
    - name: X-Ascend-Tenant
      value: "{{tenant}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("cancel answers the job cancelled", function () {
            const b = res.getBody();
            expect(b.job_id).to.equal("{{job_id}}");
            expect(b.state).to.equal("cancelled");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
