info:
  name: clearance-cold
  type: http
  seq: 20

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    # Spec 12 Call 1: read a genuine Cloudflare challenge page with NO session stored. The curl
    # tier is blocked, a browser tier solves the challenge, and the reader stores the site's
    # session under session:scrapingcourse.com:default with cf_clearance in its waf entry.
    data: |-
      {
        "url": "https://www.scrapingcourse.com/cloudflare-challenge",
        "include_links": false,
        "heavy_mode": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("cold: solved page or a recorded environment gate", function () {
            expect([200, 428, 409]).to.include(res.getStatus());
        });
        test("cold: a solved page is success with content, a gate is the human-help or busy body", function () {
            const st = res.getStatus();
            const body = res.getBody();
            const data = typeof body === "string" ? JSON.parse(body) : body;
            if (st === 200) {
                expect(data.status).to.equal("success");
                const contentField = ["content", "text", "markdown"].find(function (field) { return typeof data[field] === "string"; });
                expect(contentField, "content-carrying string field").to.be.a("string");
                expect(data[contentField].length).to.be.at.least(50);
                return;
            }
            if (st === 428) {
                expect(data.code).to.equal("human_intervention_required");
                expect(data.vnc_url).to.be.a("string").and.not.empty;
                return;
            }
            expect(data.code).to.equal("novnc_busy");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
