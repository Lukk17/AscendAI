info:
  name: realworld-s-linkedin-jobs
  type: http
  seq: 19

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    data: |-
      {
        "url": "https://www.linkedin.com/jobs/search/?currentJobId=4372540262&f_AL=true&f_E=4&keywords=Java%20Developer&location=United%20States&origin=JOB_SEARCH_PAGE_JOB_FILTER",
        "include_links": false,
        "heavy_mode": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns a valid terminal verdict (success or human-intervention)", function () {
            const st = res.getStatus();
            const b = res.getBody() || {};
            if (st === 200) {
                expect(b.status).to.equal("success");
                const content = b.content || b.text || b.markdown || "";
                expect(content.length, "success must carry content").to.be.at.least(1);
            } else {
                expect(st).to.equal(428);
                expect(b.status).to.equal("human_intervention_required");
                expect(b.vnc_url).to.be.a("string").and.not.empty;
            }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
