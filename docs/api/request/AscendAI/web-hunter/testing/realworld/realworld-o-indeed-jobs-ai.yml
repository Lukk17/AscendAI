info:
  name: realworld-o-indeed-jobs-ai
  type: http
  seq: 15

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    data: |-
      {
        "url": "https://www.indeed.com/jobs?q=AI&l=usa&radius=25&fromage=7&from=searchOnDesktopSerp&start=20&pp=gQAeAAABnF_iawAAAAACVo1v-QA6AQEBCD6A99N9SysLaVNWOP602J2TfGu4WMTYl2QVe1DlKNumaEW23YqEO6pnPpwcCdrqVNqmBRvXggAA",
        "include_links": false,
        "heavy_mode": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns valid status code (200 or 428)", function () {
            const st = res.getStatus();
            expect([200, 428]).to.include(st);
        });
        test("body status field is success or human-intervention (never error)", function () {
            const st = res.getStatus();
            const b = res.getBody() || {};
            if (st === 200) {
                expect(b.status).to.equal("success");
                const content = b.content || b.text || b.markdown || "";
                expect(content.length, "success must carry content").to.be.at.least(1);
            } else {
                expect(b.status).to.equal("human_intervention_required");
                expect(b.vnc_url).to.be.a("string").and.not.empty;
            }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
