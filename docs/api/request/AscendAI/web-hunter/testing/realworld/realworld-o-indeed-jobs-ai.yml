info:
  name: realworld-o-indeed-jobs-ai
  type: http
  seq: 15

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    data: |-
      {
        "url": "https://www.indeed.com/jobs?q=AI&l=usa&radius=25&fromage=7&from=searchOnDesktopSerp",
        "include_links": false,
        "heavy_mode": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns valid status code (200 or 428)", function () {
            const st = res.getStatus();
            expect([200, 428]).to.include(st);
        });
        test("body status field is success or human-intervention (never error)", function () {
            const st = res.getStatus();
            const b = res.getBody() || {};
            if (st === 200) {
                expect(b.status).to.equal("success");
                const content = b.content || b.text || b.markdown || "";
                expect(content.length, "success must carry content").to.be.at.least(1);
            } else {
                expect(b.code).to.equal("human_intervention_required");
                expect(b.vnc_url).to.be.a("string").and.not.empty;
            }
        });
        test("a success must be the job list, never a sign-in prompt or a block page", function () {
            if (res.getStatus() !== 200) {
                return;
            }
            const b = res.getBody() || {};
            const content = b.content || b.text || b.markdown || "";

            expect(content.length, "a job list is longer than the 315-character sign-in prompt").to.be.at.least(1000);

            const blockMarkers = [
                "create an account or sign in",
                "Continue with Apple",
                "Security Check",
                "Just a moment...",
                "Checking if the site connection is secure",
                "Additional Verification Required",
                "Ray ID"
            ];
            blockMarkers.forEach(function (marker) {
                expect(content, "sign-in or block-page marker reported as a successful scrape: " + marker).to.not.include(marker);
            });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
