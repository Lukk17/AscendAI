info:
  name: realworld-y-amazon-se-product
  type: http
  seq: 25

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    data: |-
      {
        "url": "{{scrap_url_amazon_se}}",
        "include_links": false,
        "heavy_mode": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("returns a valid terminal verdict (success or human-intervention)", function () {
            const st = res.getStatus();
            const b = res.getBody() || {};
            if (st === 200) {
                expect(b.status).to.equal("success");
                const content = b.content || b.text || b.markdown || "";
                expect(content.length, "success must carry content").to.be.at.least(1);
            } else {
                expect(st).to.equal(428);
                expect(b.status).to.equal("human_intervention_required");
                expect(b.vnc_url).to.be.a("string").and.not.empty;
            }
        });
        test("a success must be the requested product page, never an anti-bot interstitial", function () {
            if (res.getStatus() !== 200) {
                return;
            }
            const b = res.getBody() || {};
            const content = b.content || b.text || b.markdown || "";

            expect(content, "product-identity canary missing: the ISBN-13 of the requested product").to.include("9780132350884");

            const interstitialMarkers = [
                "Klicka på knappen nedan för att fortsätta handla",
                "Fortsätt handla",
                "Enter the characters you see below",
                "Type the characters you see in this image",
                "Sorry, we just need to make sure you're not a robot",
                "To discuss automated access to Amazon data please contact",
                "api-services-support@amazon.com",
                "Prove your humanity",
                "Please verify you are a human",
                "Checking if the site connection is secure",
                "Just a moment...",
                "Attention Required!",
                "Pardon Our Interruption",
                "Access Denied",
                "403 Forbidden",
                "Additional Verification Required",
                "Ray ID"
            ];
            interstitialMarkers.forEach(function (marker) {
                expect(content, "interstitial marker reported as a successful scrape: " + marker).to.not.include(marker);
            });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
