info:
  name: current-not-found
  type: http
  seq: 7

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:9998/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
    - name: Mcp-Session-Id
      value: "{{mcp_session_id}}"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 1,
        "method": "tools/call",
        "params": {
          "name": "weather_current",
          "arguments": {
            "city": "Zzyxxqq"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Unresolvable city returns the city_not_found envelope", function () {
            const sseBody = res.getBody();
            const dataLine = String(sseBody).split("\n").find(function (line) { return line.indexOf("data:") === 0; });
            const envelope = JSON.parse(dataLine.replace(/^data:\s*/, ""));
            const payload = JSON.parse(envelope.result.content[0].text);
            expect(payload.status).to.equal("city_not_found");
            expect(payload.message).to.equal("Location not found");
            expect(payload.requestedQuery).to.equal("Zzyxxqq");
            expect(payload.location).to.be.null;
            expect(payload.temperature).to.be.null;
            expect(payload.weatherCode).to.be.null;
            expect(payload.wind).to.be.null;
            expect(payload.observedAt).to.be.null;
            expect(payload.source).to.equal("open-meteo");
            expect(isNaN(Date.parse(payload.fetchedAt))).to.be.false;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
