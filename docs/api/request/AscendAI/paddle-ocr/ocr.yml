info:
  name: ocr
  type: http
  seq: 1

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7022/v1/ocr"
  headers:
    - name: accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - D:\Development\projekty-IT\AscendAI\PaddleOCR\e2e\fixtures\argent-saga-chronicles-page1.png
      - name: lang
        type: text
        value: en
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Response carries schema_version=1", function () {
            expect(res.getBody().schema_version).to.equal("1");
        });
        test("Filename echoes back", function () {
            expect(res.getBody().filename).to.equal("argent-saga-chronicles-page1.png");
        });
        test("Language echoes back", function () {
            expect(res.getBody().language).to.equal("en");
        });
        test("At least one page", function () {
            expect(res.getBody().pages.length).to.be.greaterThan(0);
        });
        test("Extracted text carries the canary substring", function () {
            const body = res.getBody();
            const allText = body.pages.map(function (p) { return p.lines.map(function (l) { return l.text; }).join(" "); }).join(" ").toLowerCase();
            const canaries = ["argent saga", "aenaria", "halen veyr"];
            expect(canaries.some(function (c) { return allText.includes(c.toLowerCase()); })).to.be.true;
        });
        test("Every text line has a valid confidence and bounding box", function () {
            const body = res.getBody();
            body.pages.forEach(function (page) {
                page.lines.forEach(function (line) {
                    expect(line.confidence).to.be.a("number");
                    expect(line.confidence).to.be.within(0.0, 1.0);
                    expect(line.bounding_box).to.be.an("array").with.length.of.at.least(1);
                    line.bounding_box.forEach(function (point) {
                        expect(point).to.be.an("array").with.lengthOf(2);
                        expect(point[0]).to.be.a("number");
                        expect(point[1]).to.be.a("number");
                    });
                });
            });
        });
        test("processing_time_seconds is finite and non-negative", function () {
            const value = res.getBody().processing_time_seconds;
            expect(value).to.be.a("number");
            expect(isFinite(value)).to.be.true;
            expect(value).to.be.at.least(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
