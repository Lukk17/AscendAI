info:
  name: ocr-invalid-no-file
  type: http
  seq: 1

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7022/v1/ocr"
  headers:
    - name: accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: lang
        type: text
        value: en
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 422", function () {
            expect(res.getStatus()).to.equal(422);
        });
        test("detail is a non-empty array naming the missing file field", function () {
            const body = res.getBody();
            expect(body.detail).to.be.an("array").that.is.not.empty;
            const fileError = body.detail.find(function (d) { return Array.isArray(d.loc) && d.loc.includes("file"); });
            expect(fileError).to.be.ok;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
