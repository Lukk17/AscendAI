info:
  name: mcp-ocr
  type: http
  seq: 6

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7022/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
    - name: Mcp-Session-Id
      value: "{{mcp_session_id}}"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 1,
        "method": "tools/call",
        "params": {
          "name": "ocr_process",
          "arguments": {
            "file_uri": "http://host.docker.internal:9070/e2e-fixtures/argent-saga-chronicles-page1.png",
            "lang": "en"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("ocr_process tool call returns the OcrJsonResponse with the canary substring", function () {
            const sseBody = res.getBody();
            const dataLine = String(sseBody).split("\n").find(function (line) { return line.indexOf("data:") === 0; });
            const envelope = JSON.parse(dataLine.replace(/^data:\s*/, ""));
            const result = envelope.result;
            expect(result.isError === undefined || result.isError === false).to.be.true;
            const payload = JSON.parse(result.content[0].text);
            expect(payload.language).to.equal("en");
            expect(payload.filename).to.equal("argent-saga-chronicles-page1.png");
            expect(payload.pages).to.be.an("array").that.is.not.empty;
            const allText = payload.pages.map(function (p) { return p.lines.map(function (l) { return l.text; }).join(" "); }).join(" ").toLowerCase();
            const canaries = ["argent saga", "aenaria", "halen veyr"];
            expect(canaries.some(function (c) { return allText.includes(c.toLowerCase()); })).to.be.true;
            expect(payload.processing_time_seconds).to.be.a("number");
            expect(isFinite(payload.processing_time_seconds)).to.be.true;
            expect(payload.processing_time_seconds).to.be.at.least(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
