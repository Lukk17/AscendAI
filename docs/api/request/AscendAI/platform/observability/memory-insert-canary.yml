info:
  name: memory-insert-canary
  type: http
  seq: 2

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7020/api/v1/memory/insert"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "user_id": "frostyObservabilityTest",
        "text": "The observability canary prefers dark mode in every application.",
        "metadata": {"category": "canary"},
        "provider": "openai"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("The insert returns at least one stored memory with an id", function () {
            var entries = res.getBody();
            expect(entries).to.be.an("array").that.is.not.empty;
            expect(entries[0].id).to.be.a("string").and.not.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
