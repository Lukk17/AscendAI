info:
  name: auth-read-secure-anon
  type: http
  seq: 13

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    # Same URL and heavy_mode as auth-read-secure.yml but NO profile field.
    # The service has no session for this request, so it should see the login
    # page or an intervention signal — never the authenticated inventory content.
    data: |-
      {
        "url": "https://www.saucedemo.com/inventory.html",
        "include_links": false,
        "heavy_mode": true
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("content has NO auth-only inventory markers (unauthenticated read gated)", function () {
            const b = res.getBody();
            const c = (b.content || b.text || b.markdown || "").toLowerCase();
            const authMarkers = [
                "lighting modes",
                "ringspun combed cotton",
                "quarter-zip fleece",
                "carry.allthethings",
                "rib cuff",
            ];
            expect(
                authMarkers.every(m => !c.includes(m)),
                "anon read must not surface authenticated inventory product descriptions"
            ).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
