info:
  name: extract-tier-js-quotes
  type: http
  seq: 10

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    data: |-
      {
        "url": "https://quotes.toscrape.com/js/",
        "include_links": false,
        "heavy_mode": true
      }
  auth: inherit

runtime:
  tests:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("status is success", function () {
            expect(res.getBody().status).to.equal("success");
        });
        test("JS tier: content contains JS-rendered quote", function () {
            const b = res.getBody();
            const content = b.content || b.text || b.markdown || "";
            expect(content).to.include("The world as we have created it");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
