info:
  name: realworld-n-nowsecure-nl
  type: http
  seq: 14

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    data: |-
      {
        "url": "https://nowsecure.nl",
        "include_links": false,
        "heavy_mode": false
      }
  auth: inherit

runtime:
  tests:
    - type: after-response
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("status is success (Cloudflare challenge solved)", function () {
            expect(res.getBody().status).to.equal("success");
        });
        test("content non-empty (not the block page)", function () {
            const b = res.getBody();
            const content = b.content || b.text || b.markdown || "";
            expect(content.length).to.be.at.least(50);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
