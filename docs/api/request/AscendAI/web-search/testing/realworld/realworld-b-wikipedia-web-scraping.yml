info:
  name: realworld-b-wikipedia-web-scraping
  type: http
  seq: 2

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    data: |-
      {
        "url": "https://en.wikipedia.org/wiki/Web_scraping",
        "include_links": false,
        "heavy_mode": false
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("status is success", function () {
            expect(res.getBody().status).to.equal("success");
        });
        test("content contains canary 'web scraping'", function () {
            const b = res.getBody();
            const c = (b.content || b.text || b.markdown || "").toLowerCase();
            expect(c).to.include("web scraping");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
