info:
  name: auth-read-secure
  type: http
  seq: 12

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7021/api/v2/web/read"
  body:
    type: json
    # Hardcoded saucedemo defaults: the inventory page + auth-only product-description markers.
    # No secrets — saucedemo's public demo creds are hardcoded in the seed harness.
    data: |-
      {
        "url": "https://www.saucedemo.com/inventory.html",
        "include_links": false,
        "heavy_mode": true,
        "profile": "e2e"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("status is success (session replayed via browser tier)", function () {
            expect(res.getBody().status).to.equal("success");
        });
        test("content shows authenticated inventory (auth-only product descriptions)", function () {
            const b = res.getBody();
            const c = (b.content || b.text || b.markdown || "").toLowerCase();
            const authMarkers = [
                "lighting modes",
                "ringspun combed cotton",
                "quarter-zip fleece",
                "carry.allthethings",
                "rib cuff",
            ];
            expect(
                authMarkers.some(m => c.includes(m)),
                "expected an auth-only inventory product description (anon login page has none)"
            ).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
