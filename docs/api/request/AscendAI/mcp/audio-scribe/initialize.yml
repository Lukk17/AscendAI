info:
  name: initialize
  type: http
  seq: 1

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7017/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 1,
        "method": "initialize",
        "params": {
          "protocolVersion": "{{mcp_protocol_version}}",
          "capabilities": {},
          "clientInfo": { "name": "postman-client", "version": "0.1.0" }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Session ID header is returned and non-empty", function () {
            const sessionId = res.getHeader("MCP-Session-Id");
            expect(sessionId).to.not.be.undefined;
            expect(sessionId).to.not.be.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
