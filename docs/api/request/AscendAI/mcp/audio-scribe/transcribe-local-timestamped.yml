info:
  name: transcribe-local-timestamped
  type: http
  seq: 7

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7017/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
    - name: MCP-Session-Id
      value: "{{mcp_session_id}}"
    - name: MCP-Protocol-Version
      value: "{{mcp_protocol_version}}"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 7,
        "method": "tools/call",
        "params": {
          "name": "transcribe_local",
          "arguments": {
            "audio_uri": "{{audio_uri_docker}}",
            "model": "Systran/faster-whisper-large-v3",
            "language": "en",
            "with_timestamps": true
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("transcribe_local with timestamps returns success envelope with timestamped segments", function () {
            const sseBody = res.getBody();
            const dataLine = String(sseBody).split("\n").find(function (line) { return line.indexOf("data:") === 0; });
            const envelope = JSON.parse(dataLine.replace(/^data:\s*/, ""));
            const payload = JSON.parse(envelope.result.content[0].text);
            expect(payload.status).to.equal("success");
            expect(payload).to.have.property("source");
            expect(payload.source).to.equal("local");
            expect(payload).to.have.property("language");
            expect(payload.language).to.equal("en");
            expect(payload).to.have.property("transcription");
            expect(payload.transcription).to.be.an("array");
            if (payload.transcription.length > 0) {
                expect(payload.transcription[0]).to.have.property("text");
                expect(payload.transcription[0]).to.have.property("timestamp");
                expect(payload.transcription[0].timestamp).to.be.an("array");
            }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
