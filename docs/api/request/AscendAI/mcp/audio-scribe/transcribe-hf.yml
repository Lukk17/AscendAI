info:
  name: transcribe-hf
  type: http
  seq: 6

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7017/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
    - name: MCP-Session-Id
      value: "{{mcp_session_id}}"
    - name: MCP-Protocol-Version
      value: "{{mcp_protocol_version}}"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 5,
        "method": "tools/call",
        "params": {
          "name": "transcribe_hf",
          "arguments": {
            "audio_uri": "{{audio_uri_docker}}",
            "model": "openai/whisper-large-v3",
            "hf_provider": "hf-inference"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("transcribe_hf returns a success envelope with transcription", function () {
            const sseBody = res.getBody();
            const dataLine = String(sseBody).split("\n").find(function (line) { return line.indexOf("data:") === 0; });
            const envelope = JSON.parse(dataLine.replace(/^data:\s*/, ""));
            const payload = JSON.parse(envelope.result.content[0].text);
            expect(payload.status).to.equal("success");
            expect(payload).to.have.property("source");
            expect(payload.source).to.equal("huggingface");
            expect(payload).to.have.property("model");
            expect(payload.model).to.equal("openai/whisper-large-v3");
            expect(payload).to.have.property("provider");
            expect(payload.provider).to.equal("hf-inference");
            expect(payload).to.have.property("transcription");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
