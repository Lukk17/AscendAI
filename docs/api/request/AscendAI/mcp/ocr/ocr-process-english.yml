info:
  name: ocr-process-english
  type: http
  seq: 3

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7022/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
    - name: MCP-Session-Id
      value: "{{mcp_session_id}}"
    - name: MCP-Protocol-Version
      value: "{{mcp_protocol_version}}"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 3,
        "method": "tools/call",
        "params": {
          "name": "ocr_process",
          "arguments": {
            "file_uri": "/path/to/image.png",
            "lang": "en"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("ocr_process with English language returns valid OCR response", function () {
            const sseBody = res.getBody();
            const dataLine = String(sseBody).split("\n").find(function (line) { return line.indexOf("data:") === 0; });
            const envelope = JSON.parse(dataLine.replace(/^data:\s*/, ""));
            const payload = JSON.parse(envelope.result.content[0].text);
            expect(payload).to.have.property("status");
            expect(payload.status).to.equal("ok");
            expect(payload).to.have.property("language");
            expect(payload.language).to.equal("en");
            expect(payload).to.have.property("pages");
            expect(payload.pages).to.be.an("array");
            expect(payload.pages.length).to.be.at.least(1);
            expect(payload.pages[0]).to.have.property("lines");
            expect(payload.pages[0].lines).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
