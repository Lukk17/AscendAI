info:
  name: insert-memory
  type: http
  seq: 3

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7020/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
    - name: MCP-Session-Id
      value: "{{mcp_session_id}}"
    - name: MCP-Protocol-Version
      value: "{{mcp_protocol_version}}"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 3,
        "method": "tools/call",
        "params": {
          "name": "memory_insert",
          "arguments": {
            "user_id": "{{userId}}",
            "text": "This is a test memory: red dolphin"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("MCP insert-memory returns success envelope", function () {
            const sseBody = res.getBody();
            const dataLine = String(sseBody).split("\n").find(function (line) { return line.indexOf("data:") === 0; });
            const envelope = JSON.parse(dataLine.replace(/^data:\s*/, ""));
            expect(envelope).to.have.property("result");
            expect(envelope.result).to.have.property("content");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
