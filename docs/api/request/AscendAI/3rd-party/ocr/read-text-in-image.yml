info:
  name: read-text-in-image
  type: http
  seq: 1

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7022/v1/ocr/jobs"
  headers:
    - name: accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - /C:/Users/Lukk/Desktop/test-image.pdf
      - name: lang
        type: text
        value: pl

runtime:
  scripts:
    - type: tests
      code: |-
        test("The document is accepted for reading", function () {
            expect(res.getStatus()).to.equal(202);
        });
        test("The answer carries an identifier and where to read the state", function () {
            const body = res.getBody();
            expect(body.job_id).to.be.a("string").with.lengthOf(22);
            expect(body.status_url).to.equal("/v1/ocr/jobs/" + body.job_id);
            expect(body.poll_after_seconds).to.be.a("number").greaterThan(0);
        });
        test("The answer carries no page content", function () {
            expect(res.getBody()).to.not.have.property("pages");
        });
    - type: post-response
      code: |-
        bru.setVar("ocrJobId", res.getBody().job_id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
