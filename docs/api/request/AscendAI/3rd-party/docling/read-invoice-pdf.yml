info:
  name: read-invoice-pdf
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:5001/v1/convert/file
  headers:
    - name: accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: files
        type: file
        value:
          - /C:/Users/Lukk/Desktop/test.pdf
        contentType: application/pdf
      - name: do_ocr
        type: text
        value: "true"
      - name: table_mode
        type: text
        value: accurate
      - name: to_formats
        type: text
        value: json
      - name: lang
        type: text
        value: pol

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("docling conversion returns structured document with content", function () {
            const body = res.getBody();
            expect(body).to.be.a("string");
            const data = typeof body === "string" ? JSON.parse(body) : body;
            expect(data).to.have.property("result");
            expect(data.result).to.be.an("array");
            expect(data.result.length).to.be.at.least(1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
