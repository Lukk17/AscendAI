info:
  name: insert-isolation-user-a
  type: http
  seq: 13

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7020/api/v1/memory/insert"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "user_id": "frostyMemoryIsolationUserA",
        "provider": "openai",
        "text": "My secret favourite city is Tromsø"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("memory_insert returns success status with results", function () {
            const body = res.getBody();
            const data = typeof body === "string" ? JSON.parse(body) : body;
            expect(data).to.have.property("status");
            expect(data.status).to.equal("success");
            expect(data).to.have.property("results");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
