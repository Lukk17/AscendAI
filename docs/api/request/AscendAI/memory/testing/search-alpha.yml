info:
  name: search-alpha
  type: http
  seq: 8

http:
  method: GET
  url: "{{protocol}}://{{baseUrl}}:7020/api/v1/memory/search?user_id=frostyMemoryWipeAlpha&query=Where do I like to live?&provider=openai"
  params:
    - name: user_id
      value: frostyMemoryWipeAlpha
      type: query
    - name: query
      value: Where do I like to live?
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("memory_search returns success status with results array", function () {
            const body = res.getBody();
            const data = typeof body === "string" ? JSON.parse(body) : body;
            expect(data).to.have.property("status");
            expect(data.status).to.equal("success");
            expect(data).to.have.property("results");
            expect(data.results).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
