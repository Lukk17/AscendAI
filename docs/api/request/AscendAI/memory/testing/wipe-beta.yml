info:
  name: wipe-beta
  type: http
  seq: 7

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7020/api/v1/memory/wipe?user_id=frostyMemoryWipeBeta&provider=openai"
  params:
    - name: user_id
      value: frostyMemoryWipeBeta
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("memory_wipe returns success status with message", function () {
            const body = res.getBody();
            const data = typeof body === "string" ? JSON.parse(body) : body;
            expect(data).to.have.property("status");
            expect(data.status).to.equal("success");
            expect(data).to.have.property("message");
            expect(data.message).to.include("wiped");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
