info:
  name: invalid-missing-user
  type: http
  seq: 1

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7020/api/v1/memory/insert"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "text": "Memory body without a user_id field"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("A submission with no user_id is rejected with the validation code", function () {
            expect(res.getStatus()).to.equal(400);
        });
        test("The body is the problem body with the validation code", function () {
            const body = res.getBody();
            expect(body.code).to.equal("validation");
            expect(body.detail).to.be.a("string").and.not.empty;
        });
        test("The errors array names the missing user_id field", function () {
            const body = res.getBody();
            expect(body.errors).to.be.an("array").that.is.not.empty;
            const fields = body.errors.map(function (entry) { return entry.field; });
            expect(fields).to.include("user_id");
            body.errors.forEach(function (entry) {
                expect(entry.message).to.be.a("string").and.not.empty;
            });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
