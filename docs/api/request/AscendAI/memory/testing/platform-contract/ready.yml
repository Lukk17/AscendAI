info:
  name: ready
  type: http
  seq: 2

http:
  method: GET
  url: "{{protocol}}://{{baseUrl}}:7020/ready"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("status is ready", function () {
            expect(res.getBody().status).to.equal("ready");
        });
        test("service is ascend-memory", function () {
            expect(res.getBody().service).to.equal("ascend-memory");
        });
        test("version is a non-empty string", function () {
            expect(res.getBody().version).to.be.a("string").and.not.empty;
        });
        test("every check reports ok or skipped", function () {
            var checks = res.getBody().checks;
            expect(checks).to.be.an("object");
            expect(Object.keys(checks)).to.not.be.empty;
            Object.keys(checks).forEach(function (name) {
                expect(checks[name].status, "check " + name).to.be.oneOf(["ok", "skipped"]);
            });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
