info:
  name: traceparent-refusal
  type: http
  seq: 7

http:
  method: GET
  url: "{{protocol}}://{{baseUrl}}:7020/does-not-exist"
  headers:
    - name: traceparent
      value: 00-4bf92f3577b34da6a3ce929d0e0e4736-00f067aa0ba902b7-01
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 404", function () {
            expect(res.getStatus()).to.equal(404);
        });
        test("traceId continues the incoming traceparent", function () {
            expect(res.getBody().traceId).to.equal("4bf92f3577b34da6a3ce929d0e0e4736");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
