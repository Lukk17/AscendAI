info:
  name: ocr-job-result
  type: http
  seq: 3

http:
  method: GET
  url: "{{ocrResultUrl}}"
  headers:
    - name: accept
      value: text/markdown
  auth: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("The time-limited link fetches the stored object", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("The object is the document's text, one heading per page", function () {
            const markdown = String(res.getBody());
            expect(markdown.split("\n")[0]).to.equal("## Page 1");
        });
        test("The object carries no front matter", function () {
            const markdown = String(res.getBody());
            expect(markdown.indexOf("---")).to.not.equal(0);
            expect(markdown).to.not.include("schema_version");
        });
        test("The text is the same text the removed synchronous request returned", function () {
            const markdown = String(res.getBody()).toLowerCase();
            const canaries = ["argent saga", "aenaria", "halen veyr"];
            expect(canaries.some(function (c) { return markdown.includes(c); })).to.be.true;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
