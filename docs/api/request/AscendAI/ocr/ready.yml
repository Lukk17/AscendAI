info:
  name: ready
  type: http
  seq: 3

http:
  method: GET
  url: "{{protocol}}://{{baseUrl}}:7022/ready"
  headers:
    - name: accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("status is ready", function () {
            expect(res.getBody().status).to.equal("ready");
        });
        test("service is ascend-ocr", function () {
            expect(res.getBody().service).to.equal("ascend-ocr");
        });
        test("version is a non-empty string", function () {
            expect(res.getBody().version).to.be.a("string").and.not.empty;
        });
        test("engine probe is ok and warm", function () {
            expect(res.getBody().checks.engine.status).to.equal("ok");
            expect(res.getBody().checks.engine.warm).to.equal("true");
        });
        test("worker pool probe is ok and accepting work", function () {
            expect(res.getBody().checks.worker_pool.status).to.equal("ok");
            expect(res.getBody().checks.worker_pool.accepting_work).to.equal("true");
        });
        test("an idle service reports nothing queued or running", function () {
            expect(res.getBody().checks.jobs.status).to.equal("ok");
            expect(res.getBody().checks.jobs.queued).to.equal("0");
            expect(res.getBody().checks.jobs.running).to.equal("0");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
