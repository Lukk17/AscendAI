info:
  name: ready
  type: http
  seq: 3

http:
  method: GET
  url: "{{protocol}}://{{baseUrl}}:7022/ready"
  headers:
    - name: accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("status is ready", function () {
            expect(res.getBody().status).to.equal("ready");
        });
        test("engine_warm true", function () {
            expect(res.getBody().engine_warm).to.equal(true);
        });
        test("version is a non-empty string", function () {
            expect(res.getBody().version).to.be.a("string").and.not.empty;
        });
        test("accepting_work true", function () {
            expect(res.getBody().accepting_work).to.equal(true);
        });
        test("an idle service reports nothing queued", function () {
            expect(res.getBody().jobs_queued).to.equal(0);
        });
        test("an idle service reports nothing running", function () {
            expect(res.getBody().jobs_running).to.equal(0);
        });
        test("queue_depth is no longer reported", function () {
            expect(res.getBody()).to.not.have.property("queue_depth");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
