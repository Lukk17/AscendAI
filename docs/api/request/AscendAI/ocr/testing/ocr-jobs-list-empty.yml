info:
  name: ocr-jobs-list-empty
  type: http
  seq: 24

http:
  method: GET
  url: "{{protocol}}://{{baseUrl}}:7022/v1/ocr/jobs"
  headers:
    - name: accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200, even with nothing in flight", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("Nothing is waiting and nothing is running", function () {
            expect(res.getBody().jobs).to.be.an("array").that.is.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
