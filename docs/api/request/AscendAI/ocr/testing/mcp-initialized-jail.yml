info:
  name: mcp-initialized-jail
  type: http
  seq: 37

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7023/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
    - name: Mcp-Session-Id
      value: "{{mcp_session_id}}"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "method": "notifications/initialized"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("The throwaway container accepts the notification with 202", function () {
            expect(res.getStatus()).to.equal(202);
        });
        test("A notification is answered with no body", function () {
            const body = res.getBody();
            expect(body === undefined || body === null || body === "").to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
