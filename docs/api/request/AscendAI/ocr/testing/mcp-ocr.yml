info:
  name: mcp-ocr
  type: http
  seq: 6

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7022/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
    - name: Mcp-Session-Id
      value: "{{mcp_session_id}}"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 1,
        "method": "tools/call",
        "params": {
          "name": "ocr_submit",
          "arguments": {
            "file_uri": "http://host.docker.internal:9070/e2e-fixtures/argent-saga-chronicles-page1.png",
            "lang": "en"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("ocr_submit answers with an identifier and no page content", function () {
            const sseBody = res.getBody();
            const dataLine = String(sseBody).split("\n").find(function (line) { return line.indexOf("data:") === 0; });
            const envelope = JSON.parse(dataLine.replace(/^data:\s*/, ""));
            const result = envelope.result;
            expect(result.isError === undefined || result.isError === false).to.be.true;
            const payload = JSON.parse(result.content[0].text);
            expect(payload.job_id).to.be.a("string").with.lengthOf(22);
            expect(payload.state).to.equal("waiting");
            expect(payload.page_count).to.equal(1);
            expect(payload.status_url).to.equal("/v1/ocr/jobs/" + payload.job_id);
            expect(payload.poll_after_seconds).to.be.a("number").greaterThan(0);
            expect(payload).to.not.have.property("pages");
            bru.setVar("ocrJobId", payload.job_id);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
