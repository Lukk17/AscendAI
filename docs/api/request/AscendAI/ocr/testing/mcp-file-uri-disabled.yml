info:
  name: mcp-file-uri-disabled
  type: http
  seq: 12

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7022/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
    - name: Mcp-Session-Id
      value: "{{mcp_session_id}}"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 7,
        "method": "tools/call",
        "params": {
          "name": "ocr_submit",
          "arguments": {
            "file_uri": "file:///etc/passwd",
            "lang": "en"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("file:// is refused with UNSAFE_URI while MCP_FILE_URI_ROOT is unset", function () {
            const sseBody = res.getBody();
            const dataLine = String(sseBody).split("\n").find(function (line) { return line.indexOf("data:") === 0; });
            const envelope = JSON.parse(dataLine.replace(/^data:\s*/, ""));
            const text = JSON.stringify(envelope);
            expect(text).to.include("UNSAFE_URI");
        });
        test("No identifier is issued, so nothing was queued", function () {
            const sseBody = res.getBody();
            const dataLine = String(sseBody).split("\n").find(function (line) { return line.indexOf("data:") === 0; });
            const envelope = JSON.parse(dataLine.replace(/^data:\s*/, ""));
            expect(JSON.stringify(envelope)).to.not.include("job_id");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
