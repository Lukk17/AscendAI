info:
  name: ocr-invalid-no-file
  type: http
  seq: 1

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7022/v1/ocr/jobs"
  headers:
    - name: accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: lang
        type: text
        value: en
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("A submission with no file is rejected before any work is queued", function () {
            expect(res.getStatus()).to.equal(422);
        });
        test("The body carries the validation detail naming the missing file, not a job record", function () {
            const body = res.getBody();
            expect(body.detail).to.be.an("array").that.is.not.empty;
            const fileError = body.detail.find(function (entry) {
                return Array.isArray(entry.loc) && entry.loc[entry.loc.length - 1] === "file";
            });
            expect(fileError, JSON.stringify(body.detail)).to.be.ok;
            expect(fileError.type).to.equal("missing");
            expect(body).to.not.have.property("state");
        });
        test("No identifier is issued", function () {
            expect(res.getBody()).to.not.have.property("job_id");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
