info:
  name: ocr-invalid-no-file
  type: http
  seq: 1

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7022/v1/ocr/jobs"
  headers:
    - name: accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: lang
        type: text
        value: en
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("A submission with no file is rejected before any work is queued", function () {
            expect(res.getStatus()).to.equal(400);
        });
        test("The body is the problem body with the validation code", function () {
            const body = res.getBody();
            expect(body.code).to.equal("validation");
            expect(body.detail).to.be.a("string").and.not.empty;
        });
        test("The errors array names the missing file field", function () {
            const body = res.getBody();
            expect(body.errors).to.be.an("array").that.is.not.empty;
            const fields = body.errors.map(function (entry) { return entry.field; });
            expect(fields).to.include("file");
            body.errors.forEach(function (entry) {
                expect(entry.message).to.be.a("string").and.not.empty;
            });
            expect(body).to.not.have.property("state");
        });
        test("No identifier is issued", function () {
            expect(res.getBody()).to.not.have.property("job_id");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
