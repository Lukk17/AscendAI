info:
  name: job-status-route-template
  type: http
  seq: 111

http:
  method: GET
  url: "{{protocol}}://{{baseUrl}}:7022/v1/ocr/jobs/BBBBBBBBBBBBBBBBBBBBBB"
  headers:
    - name: accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 404", function () {
            expect(res.getStatus()).to.equal(404);
        });
        test("code is JOB_NOT_FOUND", function () {
            expect(res.getBody().code).to.equal("JOB_NOT_FOUND");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
