info:
  name: ocr-job-not-found
  type: http
  seq: 22

http:
  method: GET
  url: "{{protocol}}://{{baseUrl}}:7022/v1/ocr/jobs/{{ocrJobId}}"
  headers:
    - name: accept
      value: application/json
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("A deleted identifier answers 404", function () {
            expect(res.getStatus()).to.equal(404);
        });
        test("The refusal carries the not-found code", function () {
            expect(res.getBody().code).to.equal("JOB_NOT_FOUND");
        });
        test("The detail says the identifier is unknown or expired", function () {
            expect(res.getBody().detail).to.include("unknown or expired");
        });
        test("No record is returned", function () {
            expect(res.getBody()).to.not.have.property("state");
            expect(res.getBody()).to.not.have.property("result");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
