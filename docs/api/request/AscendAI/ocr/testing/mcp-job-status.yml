info:
  name: mcp-job-status
  type: http
  seq: 7

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7022/mcp"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
    - name: Mcp-Session-Id
      value: "{{mcp_session_id}}"
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 2,
        "method": "tools/call",
        "params": {
          "name": "ocr_job_status",
          "arguments": {
            "job_id": "{{ocrJobId}}"
          }
        }
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 200", function () {
            expect(res.getStatus()).to.equal(200);
        });
        test("ocr_job_status returns the same record the REST surface returns", function () {
            const sseBody = res.getBody();
            const dataLine = String(sseBody).split("\n").find(function (line) { return line.indexOf("data:") === 0; });
            const envelope = JSON.parse(dataLine.replace(/^data:\s*/, ""));
            const payload = JSON.parse(envelope.result.content[0].text);
            expect(payload.job_id).to.equal(bru.getVar("ocrJobId") || bru.getEnvVar("ocrJobId"));
            expect(["waiting", "running", "succeeded", "failed", "cancelled"]).to.include(payload.state);
            expect(payload).to.not.have.property("pages");
            const terminal = ["succeeded", "failed", "cancelled"].indexOf(payload.state) >= 0;
            if (terminal) {
                expect(payload).to.not.have.property("poll_after_seconds");
            } else {
                expect(payload.poll_after_seconds).to.be.a("number").within(1, 30);
            }
            if (payload.state === "succeeded") {
                expect(payload.result.bucket).to.be.a("string").that.is.not.empty;
                expect(payload.result.key).to.equal(payload.job_id + ".md");
                bru.setVar("ocrResultUrl", payload.result.url);
            }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
