info:
  name: ocr-unsupported-mime
  type: http
  seq: 4

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7022/v1/ocr"
  headers:
    - name: accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - "{{ocrFixtures}}/not-an-image.txt"
        contentType: image/png
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Status code is 400", function () {
            expect(res.getStatus()).to.equal(400);
        });
        test("error code UNSUPPORTED_FILE_TYPE", function () {
            expect(res.getBody().code).to.equal("UNSUPPORTED_FILE_TYPE");
        });
        test("detail is the generic message with no upstream leak", function () {
            expect(res.getBody().detail).to.equal("Unsupported file type");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
