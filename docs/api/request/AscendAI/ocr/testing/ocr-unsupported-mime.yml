info:
  name: ocr-unsupported-mime
  type: http
  seq: 5

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7022/v1/ocr/jobs"
  headers:
    - name: accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - "{{ocrFixtures}}/not-an-image.txt"
        contentType: image/png
      - name: lang
        type: text
        value: en
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("A payload whose magic bytes are not an image or a PDF is refused", function () {
            expect(res.getStatus()).to.equal(400);
        });
        test("The refusal carries the unsupported-type code", function () {
            expect(res.getBody().code).to.equal("UNSUPPORTED_FILE_TYPE");
        });
        test("No identifier is issued, so nothing was queued", function () {
            expect(res.getBody()).to.not.have.property("job_id");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
