info:
  name: ocr-default-lang
  type: http
  seq: 4

http:
  method: POST
  url: "{{protocol}}://{{baseUrl}}:7022/v1/ocr/jobs"
  headers:
    - name: accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - "{{ocrFixtures}}/argent-saga-chronicles-page1.png"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("Answer is 202 Accepted, not a completed reading", function () {
            expect(res.getStatus()).to.equal(202);
        });
        test("Answer carries a job identifier", function () {
            expect(res.getBody().job_id).to.be.a("string").with.lengthOf(22);
        });
        test("Work is accepted, not finished", function () {
            expect(res.getBody().state).to.equal("waiting");
        });
        test("Answer says where the state can be read", function () {
            const body = res.getBody();
            expect(body.status_url).to.equal("/v1/ocr/jobs/" + body.job_id);
            expect(res.getHeader("location")).to.equal("/v1/ocr/jobs/" + body.job_id);
        });
        test("Answer says when to ask again", function () {
            expect(res.getBody().poll_after_seconds).to.be.a("number").greaterThan(0);
        });
        test("Answer says how much work is ahead of it", function () {
            expect(res.getBody().queue_position).to.be.a("number").at.least(0);
            expect(res.getBody().pages_ahead).to.be.a("number").at.least(0);
        });
        test("Answer carries no page content", function () {
            expect(res.getBody()).to.not.have.property("pages");
            expect(JSON.stringify(res.getBody())).to.not.include("\"lines\"");
            expect(JSON.stringify(res.getBody())).to.not.include("\"text\"");
        });
        test("One page image is one page of work", function () {
            expect(res.getBody().page_count).to.equal(1);
        });
    - type: post-response
      code: |-
        bru.setVar("ocrJobId", res.getBody().job_id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
