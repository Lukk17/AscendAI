server:
  port: 9998

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      service: weather-mcp
      version: "@project.version@"
    distribution:
      percentiles-histogram:
        mcp.tool.duration: true

spring:
  application:
    name: ascend-ai-weather-mcp
  threads:
    virtual:
      enabled: true

  ai:
    mcp:
      server:
        enabled: true
        name: ascend-ai-weather-mcp
        version: 0.0.1
        type: ASYNC
        protocol: STREAMABLE
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

logging:
  level:
    org.springframework.ai.mcp: INFO
