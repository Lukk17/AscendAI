name: ascend-scrapper

# Standalone web-search stack for a single-host deployment (homelab, VPS).
# This file is self-contained: it builds nothing and pulls every image from a
# public registry. See README.md for prerequisites and how it differs from the
# development stack in the repository root.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ─── Search infrastructure ───

  searxng:
    image: searxng/searxng:2026.8.14-094c33d40
    container_name: searxng
    restart: unless-stopped
    logging: *default-logging
    environment:
      - "SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET must be set in .env (at least 32 characters, unique to this deployment)}"
    volumes:
      # NOT mounted :ro because SearXNG's container init chowns the file at
      # boot; a read-only mount makes the container restart-loop.
      - ./searxng/settings.yml:/etc/searxng/settings.yml
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      default:
        aliases:
          - searxng

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.0
    container_name: flaresolverr
    restart: unless-stopped
    logging: *default-logging
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
      - TZ=UTC
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8191/health"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5
    deploy:
      resources:
        # Runs its own Chrome, which is why this is the second-largest budget.
        limits:
          cpus: "1.0"
          memory: 1280M
        reservations:
          cpus: "0.15"
          memory: 256M
    networks:
      default:
        aliases:
          - flaresolverr

  # ─── Web search service ───

  ngrok-ascend-web-search:
    image: ngrok/ngrok:3
    container_name: ngrok-ascend-web-search
    restart: unless-stopped
    logging: *default-logging
    environment:
      - "NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN must be set in .env (get one at https://dashboard.ngrok.com/get-started/your-authtoken)}"
    command: "http ascend-web-search:7900"
    depends_on:
      - ascend-web-search
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M
        reservations:
          cpus: "0.05"
          memory: 32M
    networks:
      default:
        aliases:
          - ngrok-ascend-web-search

  ascend-web-search:
    image: lukk17/ascend-web-search:v0.0.3
    container_name: ascend-web-search
    hostname: ascend-web-search
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "7021:7021"
    extra_hosts:
      # Docker Engine on Linux does not define this name on its own.
      # REDIS_URL below depends on it resolving to the Docker host.
      - "host.docker.internal:host-gateway"
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
      - API_PORT=7021
      - API_HOST=0.0.0.0
      - LOG_LEVEL=INFO
      - SEARXNG_USER_AGENT=AscendWebSearch/1.0
      - SEARXNG_X_REAL_IP=0.0.0.0
      - SEARXNG_X_FORWARDED_FOR=0.0.0.0
      - BLOCKLIST_URL=https://secure.fanboy.co.nz/fanboy-annoyance.txt
      - VALIDATION_MIN_WORDS=10
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      - PUBLIC_VNC_URL=http://ngrok-ascend-web-search:4040/api/tunnels
      # Redis runs on the Docker host, not in this stack. See README.md.
      - REDIS_URL=redis://host.docker.internal:6379/0
      - NOVNC_TIMEOUT_SECONDS=600
      # Required here. The ngrok tunnel puts the NoVNC desktop on the public
      # internet, so an unauthenticated desktop is not an option.
      - "VNC_PASSWORD=${VNC_PASSWORD:?VNC_PASSWORD must be set in .env (8 characters, the VNC protocol truncates anything longer)}"
    cap_add:
      - SYS_ADMIN
    # 1gb rather than the development stack's 2gb. /dev/shm is charged to this
    # container's memory cgroup, so shared memory eats the ceiling below.
    # Docker's 64m default is what crashes Chromium; 1gb is ample for one browser.
    shm_size: "1gb"
    depends_on:
      searxng:
        condition: service_healthy
      flaresolverr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7021/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        # Sized for an 8 GB host. See "Resource footprint" in README.md for the
        # arithmetic and for what to change on a larger or smaller machine.
        limits:
          cpus: "1.5"
          memory: 2560M
        reservations:
          cpus: "0.25"
          memory: 512M
    networks:
      default:
        aliases:
          - ascend-web-search
