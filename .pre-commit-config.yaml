repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^apps/ascend-ocr/
      - id: ruff-format
        files: ^apps/ascend-ocr/

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: bash -c 'cd apps/ascend-ocr || exit 1; py=.venv/bin/python; [ -x "$py" ] || py=.venv/Scripts/python.exe; exec "$py" -m mypy src tests'
        language: system
        files: ^apps/ascend-ocr/((src|tests)/|pyproject\.toml$)
        pass_filenames: false

  - repo: https://github.com/awslabs/git-secrets
    rev: 1.3.0
    hooks:
      - id: git-secrets
