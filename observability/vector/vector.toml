[sources.docker_logs]
type = "docker_logs"
include_containers = [
  "ascend-agent",
  "weather-mcp",
  "ascend-memory",
  "audio-scribe",
  "ascend-web-search",
  "ascend-paddle-ocr",
]

[sinks.loki]
type = "loki"
inputs = ["docker_logs"]
endpoint = "http://loki:3100"
encoding.codec = "text"

  [sinks.loki.labels]
  service = "{{ container_name }}"
  source = "docker"

# ─── Placeholder sinks for cloud migration ────────────────────────────────────
# To migrate log shipping, uncomment the desired sink, set the required env var,
# and remove (or keep) the loki sink above. Services are never touched.

