[project]
name = "ascend-memory"
version = "0.1.4"
description = "AscendAI Memory Service (MCP + REST)"
requires-python = ">=3.11"
dependencies = [
    "ascend-python-common==1.0.0",
    "mem0ai==2.0.4",
    "httpx==0.28.1",
    "qdrant-client==1.16.2",
]

[project.optional-dependencies]
dev = [
    "ascend-python-common[dev]==1.0.0",
    "httpx2==2.13.1",
    "pyright==1.1.408"
]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportMissingTypeArgument = false
reportUntypedFunctionDecorator = false
reportUnusedFunction = false

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = false
reportUnknownLambdaType = false
reportArgumentType = false
reportMissingParameterType = false
reportMissingTypeArgument = false
reportGeneralTypeIssues = false
reportUntypedFunctionDecorator = false
reportAttributeAccessIssue = false

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]
addopts = "--cov=src --cov-branch --cov-report=term-missing --cov-fail-under=100 --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.ruff]
extend = "../../libs/ascend-python-common/tooling/ruff.toml"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "S105", "S106", "PLR2004",
    "SIM117",
    "RUF059",
    "B010",
    "E501",
    "PLR1711",
    "PLE2502",
    "ARG001",
    "ARG002",
    "ARG005",
    "SLF001",
    "TC002",
]
"tests/conftest.py" = [
    "E402",
    "PT022",
    "I001",
    "S101", "S105", "S106", "PLR2004",
    "SIM117",
    "RUF059",
    "B010",
    "E501",
    "PLR1711",
    "PLE2502",
    "ARG001",
    "ARG002",
    "ARG005",
    "SLF001",
    "TC002",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
ignore_missing_imports = false
mypy_path = "../../libs/ascend-python-common/src"

[[tool.mypy.overrides]]
module = [
    "mem0.*",
    "qdrant_client.*",
    "colorlog.*",
    "fastmcp.*",
    "prometheus_client.*",
    "prometheus_fastapi_instrumentator.*",
    "opentelemetry.*",
    "opentelemetry.exporter.*",
    "opentelemetry.instrumentation.*",
    "opentelemetry.sdk.*",
]
ignore_missing_imports = true

[tool.setuptools]
packages = ["src"]
