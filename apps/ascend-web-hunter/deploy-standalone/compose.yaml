name: ascend-scrapper

# Standalone web-search stack for a single-host deployment (homelab, VPS).
# This file is self-contained: it builds nothing and pulls every image from a
# public registry. See README.md for prerequisites and how it differs from the
# development stack in the repository root.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ─── Search infrastructure ───

  searxng:
    image: searxng/searxng:2026.8.14-094c33d40@sha256:892cf809341915a4b7710d3c9045005b4c377d51335a089b6d4da0b28750788d
    container_name: searxng
    restart: unless-stopped
    logging: *default-logging
    environment:
      - "SEARXNG_SECRET=${SEARXNG_SECRET:?SEARXNG_SECRET must be set in .env (at least 32 characters, unique to this deployment)}"
    volumes:
      # NOT mounted :ro because SearXNG's container init chowns the file at
      # boot; a read-only mount makes the container restart-loop.
      - ./searxng/settings.yml:/etc/searxng/settings.yml
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.1"
          memory: 128M
    networks:
      default:
        aliases:
          - searxng

  # ─── Bundled Redis ───

  # Runs unconditionally: this bundle has no operator-supplied Redis to fall
  # back to, so the stack must ship its own to be self-contained. REDIS_URL
  # below already defaults to this service, so nothing else needs setting.
  # To use an external Redis instead, override REDIS_URL and scale this
  # service to zero (`docker compose up -d --scale redis=0`); see
  # "Prerequisites" in README.md for every Redis option this bundle supports.
  #
  # ascend-web-hunter below waits for this container to report healthy
  # before starting (depends_on, condition: service_healthy), the same way
  # it already waits on searxng. Redis's own start_period
  # is 10s against searxng's 30s, so this adds no
  # measurable startup time; it only closes the race where the first request
  # after a cold start would otherwise hit ascend-web-hunter before Redis is
  # ready and get an avoidably not-ready response. ascend-web-hunter's own
  # Redis client still tolerates Redis being absent or unreachable later
  # (falls back to an in-memory cache, and GET /ready answers "not-ready"
  # with the redis check reading "error" while the process keeps running),
  # so this is a startup-ordering improvement, not a hard requirement.
  redis:
    image: redis:8.10.1-alpine@sha256:ef216d85ec44f4fdf7c0e6df2d1757a4734ed32fbb278cabd3181b5a27353b79
    container_name: redis
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        # The platform's own Redis instance peaks at 46 MiB
        # (../../../docs/architecture/memory-budget.md, memory.peak,
        # 2026-09-06). 256M leaves headroom for session growth on this 8 GB
        # host without threatening its budget; see "Resource footprint"
        # below for the full arithmetic.
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    networks:
      default:
        aliases:
          - redis

  # ─── Web search service ───

  ngrok-ascend-web-hunter:
    image: ngrok/ngrok:3@sha256:ff3b5c3674432d14a786349908b7bdf28ee56c25662637afcbe7180d471993ef
    container_name: ngrok-ascend-web-hunter
    restart: unless-stopped
    logging: *default-logging
    environment:
      - "NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN must be set in .env (get one at https://dashboard.ngrok.com/get-started/your-authtoken)}"
    command: "http ascend-web-hunter:7900"
    depends_on:
      - ascend-web-hunter
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 96M
        reservations:
          cpus: "0.05"
          memory: 32M
    networks:
      default:
        aliases:
          - ngrok-ascend-web-hunter

  ascend-web-hunter:
    image: lukk17/ascend-ai-ascend-web-hunter:v0.0.15
    container_name: ascend-web-hunter
    hostname: ascend-web-hunter
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${WEB_HUNTER_HOST_PORT:-7021}:${WEB_HUNTER_API_PORT:-7021}"
    extra_hosts:
      # Docker Engine on Linux does not define this name on its own.
      # REDIS_URL below depends on it resolving to the Docker host.
      - "host.docker.internal:host-gateway"
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${WEB_HUNTER_API_PORT:-7021}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
      - RATE_LIMIT_DEFAULT=${WEB_HUNTER_RATE_LIMIT_DEFAULT:-1200/minute}
      - READINESS_PROBE_TIMEOUT_SECONDS=${READINESS_PROBE_TIMEOUT_SECONDS:-3}
      - STARTUP_PROBE_TIMEOUT_SECONDS=${STARTUP_PROBE_TIMEOUT_SECONDS:-2}
      - SECURITY_HSTS_MAX_AGE_SECONDS=${SECURITY_HSTS_MAX_AGE_SECONDS:-63072000}
      - MCP_ALLOWED_HOST_HEADERS=${WEB_HUNTER_MCP_ALLOWED_HOST_HEADERS:-ascend-web-hunter,localhost,127.0.0.1}
      - FETCH_MAX_REDIRECT_HOPS=${WEB_HUNTER_FETCH_MAX_REDIRECT_HOPS:-10}
      - CHALLENGE_DETECTION_MAX_BYTES=${CHALLENGE_DETECTION_MAX_BYTES:-50000}
      - CHALLENGE_WALL_MAX_BYTES=${CHALLENGE_WALL_MAX_BYTES:-50000}
      - CHALLENGE_SCORE_THRESHOLD=${CHALLENGE_SCORE_THRESHOLD:-100}
      - CHALLENGE_RICH_CONTENT_WORDS=${CHALLENGE_RICH_CONTENT_WORDS:-150}
      - CHALLENGE_FORM_DOMINANCE_RATIO=${CHALLENGE_FORM_DOMINANCE_RATIO:-0.6}
      - CHALLENGE_MIN_WORDS_PER_KB=${CHALLENGE_MIN_WORDS_PER_KB:-2.0}
      - CHALLENGE_THIN_LINK_COUNT=${CHALLENGE_THIN_LINK_COUNT:-5}
      - CHALLENGE_RICH_LINK_COUNT=${CHALLENGE_RICH_LINK_COUNT:-20}
      - CHALLENGE_SHAPE_MAX_BYTES=${CHALLENGE_SHAPE_MAX_BYTES:-500000}
      - CHALLENGE_WEIGHT_DEFINITIVE_HEADER=${CHALLENGE_WEIGHT_DEFINITIVE_HEADER:-200}
      - CHALLENGE_WEIGHT_INTERSTITIAL_STRUCTURE=${CHALLENGE_WEIGHT_INTERSTITIAL_STRUCTURE:-80}
      - CHALLENGE_WEIGHT_VENDOR_SCRIPT=${CHALLENGE_WEIGHT_VENDOR_SCRIPT:-60}
      - CHALLENGE_WEIGHT_VENDOR_PRESENCE=${CHALLENGE_WEIGHT_VENDOR_PRESENCE:-30}
      - CHALLENGE_WEIGHT_STATUS_EMPTY_BODY=${CHALLENGE_WEIGHT_STATUS_EMPTY_BODY:-200}
      - CHALLENGE_WEIGHT_STATUS_SMALL_BODY=${CHALLENGE_WEIGHT_STATUS_SMALL_BODY:-50}
      - CHALLENGE_WEIGHT_STATUS_LARGE_BODY=${CHALLENGE_WEIGHT_STATUS_LARGE_BODY:-20}
      - CHALLENGE_WEIGHT_CAPTCHA_INPUT=${CHALLENGE_WEIGHT_CAPTCHA_INPUT:-50}
      - CHALLENGE_WEIGHT_CAPTCHA_ELEMENT=${CHALLENGE_WEIGHT_CAPTCHA_ELEMENT:-40}
      - CHALLENGE_WEIGHT_FORM_DOMINANCE=${CHALLENGE_WEIGHT_FORM_DOMINANCE:-40}
      - CHALLENGE_WEIGHT_SCRIPT_ONLY_BODY=${CHALLENGE_WEIGHT_SCRIPT_ONLY_BODY:-40}
      - CHALLENGE_WEIGHT_THIN_TEXT=${CHALLENGE_WEIGHT_THIN_TEXT:-20}
      - CHALLENGE_WEIGHT_FEW_LINKS=${CHALLENGE_WEIGHT_FEW_LINKS:-20}
      - CHALLENGE_WEIGHT_NO_ARTICLE=${CHALLENGE_WEIGHT_NO_ARTICLE:-20}
      - CHALLENGE_WEIGHT_RICH_CONTENT=${CHALLENGE_WEIGHT_RICH_CONTENT:--70}
      - CHALLENGE_WEIGHT_MANY_LINKS=${CHALLENGE_WEIGHT_MANY_LINKS:--20}
      - CHALLENGE_WEIGHT_SERVED_PAGE=${CHALLENGE_WEIGHT_SERVED_PAGE:--30}
      - CHALLENGE_WEIGHT_PHRASE_TITLE=${CHALLENGE_WEIGHT_PHRASE_TITLE:-60}
      - CHALLENGE_WEIGHT_PHRASE_BODY=${CHALLENGE_WEIGHT_PHRASE_BODY:-30}
      - SEARXNG_USER_AGENT=ascend-web-hunter/1.0
      - SEARXNG_X_REAL_IP=0.0.0.0
      - SEARXNG_X_FORWARDED_FOR=0.0.0.0
      - BLOCKLIST_URL=https://secure.fanboy.co.nz/fanboy-annoyance.txt
      - VALIDATION_MIN_WORDS=10
      - CAMOUFOX_ENABLED=${CAMOUFOX_ENABLED:-true}
      - TIER_MEMORY_TTL_SECONDS=${TIER_MEMORY_TTL_SECONDS:-86400}
      - NETWORKIDLE_POLL_MS=${NETWORKIDLE_POLL_MS:-1000}
      - SCROLL_PAUSE_MS=${SCROLL_PAUSE_MS:-200}
      - EXTRACTION_SCHEMA_MAX_BYTES=${EXTRACTION_SCHEMA_MAX_BYTES:-16384}
      - EXTRACTION_LLM_BASE_URL=${EXTRACTION_LLM_BASE_URL:-}
      - EXTRACTION_LLM_MODEL=${EXTRACTION_LLM_MODEL:-}
      - EXTRACTION_LLM_API_KEY=${EXTRACTION_LLM_API_KEY}
      - EXTRACTION_LLM_MAX_INPUT_CHARS=${EXTRACTION_LLM_MAX_INPUT_CHARS:-60000}
      - EXTRACTION_LLM_TIMEOUT_SECONDS=${EXTRACTION_LLM_TIMEOUT_SECONDS:-60}
      - RECIPE_TTL_SECONDS=${RECIPE_TTL_SECONDS:-604800}
      - RECIPE_SELECTOR_MAX_CHARS=${RECIPE_SELECTOR_MAX_CHARS:-512}
      - DOCUMENT_MAX_BYTES=${DOCUMENT_MAX_BYTES:-52428800}
      - DOCUMENT_FETCH_TIMEOUT_SECONDS=${DOCUMENT_FETCH_TIMEOUT_SECONDS:-300}
      - BROWSER_RESPONSE_MAX_BYTES=${BROWSER_RESPONSE_MAX_BYTES:-52428800}
      - BROWSER_TUNNEL_CONNECT_TIMEOUT_SECONDS=${BROWSER_TUNNEL_CONNECT_TIMEOUT_SECONDS:-10.0}
      - BROWSER_TUNNEL_IDLE_TIMEOUT_SECONDS=${BROWSER_TUNNEL_IDLE_TIMEOUT_SECONDS:-60.0}
      - BROWSER_TUNNEL_MAX_CONNECTIONS=${BROWSER_TUNNEL_MAX_CONNECTIONS:-256}
      - READ_RESPONSE_MAX_BYTES=${READ_RESPONSE_MAX_BYTES:-52428800}
      - DOCLING_SERVE_URL=${DOCLING_SERVE_URL:-}
      - ASCEND_OCR_URL=${ASCEND_OCR_URL:-}
      - OCR_ROUTE_TIMEOUT_SECONDS=${OCR_ROUTE_TIMEOUT_SECONDS:-300}
      - OCR_DELETE_DRAIN_SECONDS=${OCR_DELETE_DRAIN_SECONDS:-5}
      - AUDIO_SCRIBE_URL=${AUDIO_SCRIBE_URL:-}
      - READ_CACHE_PURGE_RECONNECT_SECONDS=${READ_CACHE_PURGE_RECONNECT_SECONDS:-5}
      - OBJECT_STORE_S3_ENDPOINT=${OBJECT_STORE_S3_ENDPOINT:-http://host.docker.internal:9070}
      - OBJECT_STORE_S3_PUBLIC_ENDPOINT=${OBJECT_STORE_S3_PUBLIC_ENDPOINT:-}
      - OBJECT_STORE_S3_ACCESS_KEY=${OBJECT_STORE_S3_ACCESS_KEY}
      - OBJECT_STORE_S3_SECRET_KEY=${OBJECT_STORE_S3_SECRET_KEY}
      - CRAWL_MAX_SEEDS=${CRAWL_MAX_SEEDS:-20}
      - CRAWL_MAX_PATTERNS=${CRAWL_MAX_PATTERNS:-50}
      - CRAWL_MAX_DEPTH=${CRAWL_MAX_DEPTH:-5}
      - CRAWL_DEFAULT_DEPTH=${CRAWL_DEFAULT_DEPTH:-2}
      - CRAWL_MAX_PAGES=${CRAWL_MAX_PAGES:-10000}
      - CRAWL_DEFAULT_PAGE_BUDGET=${CRAWL_DEFAULT_PAGE_BUDGET:-100}
      - CRAWL_RESULT_S3_BUCKET=${CRAWL_RESULT_S3_BUCKET:-web-hunter-crawls}
      - CRAWL_RESULT_S3_PREFIX=${CRAWL_RESULT_S3_PREFIX:-crawl-results/}
      - CRAWL_JOB_RETENTION_SECONDS=${CRAWL_JOB_RETENTION_SECONDS:-604800}
      - CRAWL_DOMAIN_CONCURRENCY=${CRAWL_DOMAIN_CONCURRENCY:-2}
      - CRAWL_DEFAULT_DELAY_SECONDS=${CRAWL_DEFAULT_DELAY_SECONDS:-1}
      - CRAWL_PROXY_URL=${CRAWL_PROXY_URL:-}
      - PROXY_URL=${PROXY_URL:-}
      - CRAWL_CLAIM_LEASE_SECONDS=${CRAWL_CLAIM_LEASE_SECONDS:-120}
      - CRAWL_CLAIM_MAX_EXPIRIES=${CRAWL_CLAIM_MAX_EXPIRIES:-2}
      - CRAWL_WORKER_CONCURRENCY=${CRAWL_WORKER_CONCURRENCY:-4}
      - CRAWL_WORKER_IDLE_SECONDS=${CRAWL_WORKER_IDLE_SECONDS:-1}
      - CRAWL_POLL_AFTER_SECONDS=${CRAWL_POLL_AFTER_SECONDS:-5}
      - CRAWL_SITEMAP_MAX_DOCUMENTS=${CRAWL_SITEMAP_MAX_DOCUMENTS:-50}
      - CRAWL_SITEMAP_MAX_BYTES=${CRAWL_SITEMAP_MAX_BYTES:-52428800}
      - CRAWL_ROBOTS_MAX_BYTES=${CRAWL_ROBOTS_MAX_BYTES:-512000}
      - CRAWL_ROBOTS_MAX_RULES=${CRAWL_ROBOTS_MAX_RULES:-1000000}
      - CRAWL_ROBOTS_CACHE_MAX_ORIGINS=${CRAWL_ROBOTS_CACHE_MAX_ORIGINS:-256}
      - CRAWL_ROBOTS_CACHE_MAX_RULES=${CRAWL_ROBOTS_CACHE_MAX_RULES:-2000000}
      - CRAWL_ROBOTS_SKIP_FACTOR=${CRAWL_ROBOTS_SKIP_FACTOR:-10}
      - CRAWL_ROBOTS_TIMEOUT_SECONDS=${CRAWL_ROBOTS_TIMEOUT_SECONDS:-30}
      - CRAWL_SITEMAP_TIMEOUT_SECONDS=${CRAWL_SITEMAP_TIMEOUT_SECONDS:-60}
      - CRAWL_MAX_DELAY_SECONDS=${CRAWL_MAX_DELAY_SECONDS:-60}
      - PUBLIC_VNC_URL=http://ngrok-ascend-web-hunter:4040/api/tunnels
      # Defaults to the bundled Redis above, which now starts unconditionally
      # with the stack. Override to redis://host.docker.internal:6379/0 to
      # use an external Redis instead; scale the bundled service to zero
      # separately if you don't want it running unused. See README.md.
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - NOVNC_TIMEOUT_SECONDS=600
      - NOVNC_PUBLIC_URL=${NOVNC_PUBLIC_URL:-}
      - NOVNC_MAX_CONCURRENT_FLOWS=${NOVNC_MAX_CONCURRENT_FLOWS:-4}
      - NOVNC_DISPLAY_SIZE=${NOVNC_DISPLAY_SIZE:-1920x1080}
      - NOVNC_WINDOW_WIDTH_PX=${NOVNC_WINDOW_WIDTH_PX:-1280}
      - NOVNC_WINDOW_HEIGHT_PX=${NOVNC_WINDOW_HEIGHT_PX:-800}
      - NOVNC_WINDOW_CASCADE_OFFSET_PX=${NOVNC_WINDOW_CASCADE_OFFSET_PX:-48}
      - NOVNC_FLOW_LEASE_GRACE_SECONDS=${NOVNC_FLOW_LEASE_GRACE_SECONDS:-30.0}
      - NOVNC_FLOW_SWEEP_INTERVAL_SECONDS=${NOVNC_FLOW_SWEEP_INTERVAL_SECONDS:-30.0}
      - NOVNC_FLOW_CANCEL_GRACE_SECONDS=${NOVNC_FLOW_CANCEL_GRACE_SECONDS:-10.0}
      - NOVNC_BUSY_RETRY_AFTER_SECONDS=${NOVNC_BUSY_RETRY_AFTER_SECONDS:-30}
      - VNC_PASSWORD=${VNC_PASSWORD:-}
    # 1gb rather than the development stack's 2gb. /dev/shm is charged to this
    # container's memory cgroup, so shared memory eats the ceiling below.
    # Docker's 64m default is what crashes Chromium; 1gb is ample for one browser.
    shm_size: "1gb"
    depends_on:
      searxng:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${WEB_HUNTER_API_PORT:-7021}/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        # Sized for an 8 GB host. See "Resource footprint" in README.md for the
        # arithmetic and for what to change on a larger or smaller machine.
        limits:
          cpus: "1.5"
          memory: 2560M
        reservations:
          cpus: "0.25"
          memory: 512M
    networks:
      default:
        aliases:
          - ascend-web-hunter

volumes:
  # Holds the bundled Redis's solved-session data (Cloudflare clearance
  # cookies, CAPTCHA outcomes) across container restarts. Without it, every
  # restart of the redis service starts cold and a human has to re-solve
  # every challenge by hand. Unused only if you scale the redis service to
  # zero to use an external Redis instead.
  redisdata:
