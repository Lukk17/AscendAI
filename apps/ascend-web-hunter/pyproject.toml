[project]
name = "ascend-web-hunter"
version = "0.0.12"
description = "AscendAI Web Search & Scraping Service"
requires-python = ">=3.12"
dependencies = [
    "ascend-python-common==2.0.0",
    "httpx==0.28.1",
    "trafilatura>=2.0.0",
    "playwright==1.60.0",
    "patchright==1.60.0",
    "camoufox==0.5.8",
    "beautifulsoup4==4.14.3",
    "textstat==0.7.13",
    "crawlee[playwright,adaptive-crawler,parsel,beautifulsoup]>=1.3.1",
    "browserforge==1.2.3",
    "playwright-stealth==2.0.3",
    "adblockparser>=0.7.0",
    "lxml==6.1.1",
    "cssselect==1.4.0",
    "curl_cffi==0.15.0",
    "tldextract==5.3.0",
    "readability-lxml>=0.8.1",
    "extruct==0.18.0",
    "jsonschema==4.26.0",
    "boto3==1.42.6",
    "protego==0.7.0",
]

[project.optional-dependencies]
dev = [
    "ascend-python-common[dev]==2.0.0",
    "boto3-stubs[s3]==1.42.6",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]
addopts = "--cov=src --cov-branch --cov-report=term-missing --cov-fail-under=100 --strict-markers --strict-config --ignore=tests/integration"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100

[tool.ruff]
extend = "../../libs/ascend-python-common/tooling/ruff.toml"
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",     # assert IS pytest idiom - never replace with if/raise
    "SIM117",   # nested `with` mocks are clearer than one combined block
    "RUF059",   # factory tuple-unpacks intentionally leave some names unused
    "PLR1711",  # bare returns in test stubs are explicit
    "PLE2502",  # security tests intentionally use CR/LF and bidi codepoints
    "ARG001",   # pytest fixtures and stub callbacks legitimately take unused args
    "ARG002",   # mock method overrides keep the original signature
    "ARG005",   # lambda kwarg shims for stub callables
    "SLF001",   # tests intentionally inspect / mutate private members
    "TC002",    # tests don't need TYPE_CHECKING guards for fixture imports
    "T201",     # corpus and catalogue tests print their reporting tables
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
ignore_missing_imports = false
mypy_path = "../../libs/ascend-python-common/src"

[[tool.mypy.overrides]]
module = [
    "crawlee.*",
    "playwright.*",
    "playwright_stealth.*",
    "patchright.*",
    "camoufox.*",
    "trafilatura.*",    "curl_cffi.*",
    "extruct.*",
    "jsonschema.*",
    "textstat.*",
    "adblockparser.*",
    "colorlog.*",
    "browserforge.*",
    "fastmcp.*",
    "tldextract.*",
    "prometheus_client.*",
    "prometheus_fastapi_instrumentator.*",
    "opentelemetry.*",
    "opentelemetry.exporter.*",
    "opentelemetry.instrumentation.*",
    "opentelemetry.sdk.*",
    "readability.*",
    "lxml.*",
]
ignore_missing_imports = true

# Camoufox ships py.typed but its public API is untyped, so calling it trips
# no-untyped-call at the call site. Scope the exemption to this module only;
# every other strict check stays on.
[[tool.mypy.overrides]]
module = [
    "src.reader.strategies.camoufox_strategy",
]
disable_error_code = ["no-untyped-call"]

[tool.setuptools]
packages = ["src"]
