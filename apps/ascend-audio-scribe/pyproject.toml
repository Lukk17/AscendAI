[project]
name = "ascend-audio-scribe"
version = "0.9.4"
description = "A dynamic speech-to-text service supporting local, OpenAI, and Hugging Face models."
requires-python = ">=3.11"
dependencies = [
    "ascend-python-common[fetch]==1.0.0",
    "fastapi==0.136.3",
    "anyio==4.13.0",
    "fastmcp==3.3.1",
    "faster-whisper==1.2.1",
    "httpx==0.28.1",
    "huggingface-hub==1.17.0",
    "openai==2.38.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "python-dotenv==1.2.2",
    "python-multipart==0.0.30",
    "pydub==0.25.1",
    "uvicorn==0.48.0",
    "aiofiles==25.1.0",
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
    "ascend-python-common[dev]==1.0.0",
    "pytest==9.0.3",
    "pytest-mock==3.15.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "asgi-lifespan==2.1.0",
    "httpx2==2.13.1",
    "ruff==0.15.15",
    "mypy==2.1.0",
    "pyright==1.1.409"
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
xfail_strict = true
filterwarnings = [
    "error",
    'ignore:Field name "MCP_DOWNLOAD_TIMEOUT_SECONDS".*:UserWarning',
    'ignore:Field name "FETCH_MAX_REDIRECT_HOPS".*:UserWarning',
]
addopts = "--cov=src --cov-branch --cov-report=term-missing --cov-fail-under=100 --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
extend = "../../libs/ascend-python-common/tooling/ruff.toml"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "S105", "S106", "S108", "PLR2004",
    "SIM117", "RUF059", "B010", "E501",
    "PLR1711", "PLE2502",
    "ARG001", "ARG002", "ARG005",
    "SLF001", "TC002",
]
"tests/conftest.py" = [
    "E402", "PT022", "I001",
    "S101", "S105", "S106", "PLR2004",
    "SIM117", "RUF059", "B010", "E501",
    "PLR1711", "PLE2502",
    "ARG001", "ARG002", "ARG005",
    "SLF001", "TC002",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
ignore_missing_imports = false
mypy_path = "../../libs/ascend-python-common/src"

[[tool.mypy.overrides]]
module = [
    "faster_whisper.*",
    "pydub.*",
    "openai.*",
    "huggingface_hub.*",
    "colorlog.*",
    "fastmcp.*",
    "prometheus_client.*",
    "prometheus_fastapi_instrumentator.*",
    "opentelemetry.*",
    "opentelemetry.exporter.*",
    "opentelemetry.instrumentation.*",
    "opentelemetry.sdk.*",
    "defusedxml.*",
    "aiofiles.*",
    "torch.*",
]
ignore_missing_imports = true

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv"]
extraPaths = ["."]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportMissingTypeArgument = false
reportUntypedFunctionDecorator = false
reportUnusedFunction = false

[[tool.pyright.executionEnvironments]]
root = "tests"
extraPaths = ["."]
reportPrivateUsage = false
reportUnknownLambdaType = false
reportArgumentType = false
reportMissingParameterType = false
reportMissingTypeArgument = false
reportGeneralTypeIssues = false
reportUntypedFunctionDecorator = false
reportAttributeAccessIssue = false

[tool.setuptools]
packages = ["src"]
