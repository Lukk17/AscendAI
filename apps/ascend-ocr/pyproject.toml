[project]
name = "ascend-ocr"
version = "0.3.1"
description = "FastAPI + FastMCP OCR microservice for AscendAI"
requires-python = ">=3.11"
dependencies = [
    "ascend-python-common[fetch]==1.0.0",
    "paddlepaddle==3.3.1",
    "paddleocr==3.7.0",
    "fastapi==0.136.3",
    "fastmcp==3.3.1",
    "mcp>=1.30.0",
    "uvicorn==0.48.0",
    "python-multipart==0.0.29",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "aiofiles==25.1.0",
    "numpy==2.3.5",
    "Pillow==12.2.0",
    "pypdfium2==5.8.0",
    "boto3==1.42.6",
    "opentelemetry-instrumentation-aiohttp-client==0.66b0",
]

[project.optional-dependencies]
dev = [
    "ascend-python-common[dev]==1.0.0",
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.15.1",
    "pytest-cov==7.1.0",
    "asgi-lifespan==2.1.0",
    "httpx==0.28.1",
    "httpx2==2.13.1",
    "ruff==0.15.15",
    "mypy==2.1.0",
    "types-aiofiles==25.1.0.20260518",
    "boto3-stubs[s3]==1.42.6",
    "mutmut==3.5.0",
    "pact-python==3.4.0",
    "pact-python-ffi==0.5.4.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
xfail_strict = true
markers = [
    "contract: Pact provider verification against the pact file the ascend-agent consumer tests write",
]
filterwarnings = [
    "error",
    'ignore:Field name "MCP_DOWNLOAD_TIMEOUT_SECONDS".*:UserWarning',
    'ignore:Field name "FETCH_MAX_REDIRECT_HOPS".*:UserWarning',
]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-branch",
    "--cov-fail-under=100",
]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/__init__.py", "src/**/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.ruff]
extend = "../../libs/ascend-python-common/tooling/ruff.toml"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "S110", "PLR2004", "PLR0915", "PLR0913", "SIM117", "RUF059", "B010", "E501", "PLR1711", "PLE2502", "ARG001", "ARG002", "ARG005", "SLF001", "TC002"]
"tests/conftest.py" = ["E402", "PT022", "I001", "S101", "S105", "S106", "S110", "PLR2004", "PLR0915", "PLR0913", "SIM117", "RUF059", "B010", "E501", "PLR1711", "PLE2502", "ARG001", "ARG002", "ARG005", "SLF001", "TC002"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_unreachable = true
ignore_missing_imports = false
mypy_path = "../../libs/ascend-python-common/src"

[[tool.mypy.overrides]]
module = ["paddleocr.*", "fastmcp.*", "slowapi.*", "prometheus_fastapi_instrumentator.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.mutmut]
paths_to_mutate = "src/"
runner = "pytest -x --no-cov -q"
tests_dir = "tests/"

[tool.setuptools]
packages = ["src", "src.api", "src.api.mcp", "src.api.rest", "src.api.middleware", "src.config", "src.model", "src.observability", "src.service"]
