name: Release

on:
  workflow_dispatch:
    inputs:
      stack_version:
        description: 'Stack version (e.g. 1.1.1). The monorepo release tag will be ascend-ai_<stack_version>.'
        required: true
        type: string
      release_ascend_agent:
        description: 'Release ascend-agent (AscendAgent/build.gradle.kts version)'
        required: true
        type: boolean
        default: false
      release_weather_mcp:
        description: 'Release weather-mcp (WeatherMCP/build.gradle.kts version)'
        required: true
        type: boolean
        default: false
      release_audio_scribe:
        description: 'Release audio-scribe (AudioScribe/pyproject.toml version)'
        required: true
        type: boolean
        default: false
      release_ascend_web_search:
        description: 'Release ascend-web-search (AscendWebSearch/pyproject.toml version)'
        required: true
        type: boolean
        default: false
      release_ascend_memory:
        description: 'Release ascend-memory (AscendMemory/pyproject.toml version)'
        required: true
        type: boolean
        default: false
      release_paddle_ocr:
        description: 'Release ascend-paddle-ocr (PaddleOCR/pyproject.toml version)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.stack_version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate and build release matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Validate inputs and build release matrix
        id: emit
        env:
          STACK_VERSION: ${{ inputs.stack_version }}
          SEL_ASCEND_AGENT:     ${{ inputs.release_ascend_agent }}
          SEL_WEATHER_MCP:      ${{ inputs.release_weather_mcp }}
          SEL_AUDIO_SCRIBE:     ${{ inputs.release_audio_scribe }}
          SEL_ASCEND_WEB_SEARCH: ${{ inputs.release_ascend_web_search }}
          SEL_ASCEND_MEMORY:    ${{ inputs.release_ascend_memory }}
          SEL_PADDLE_OCR:       ${{ inputs.release_paddle_ocr }}
        run: |
          set -euo pipefail

          TAG="ascend-ai_${STACK_VERSION}"

          # ── 1. Fail if zero apps selected ─────────────────────────────────
          SELECTED_COUNT=0
          for VAR in "$SEL_ASCEND_AGENT" "$SEL_WEATHER_MCP" "$SEL_AUDIO_SCRIBE" "$SEL_ASCEND_WEB_SEARCH" "$SEL_ASCEND_MEMORY" "$SEL_PADDLE_OCR"; do
            [ "$VAR" = "true" ] && SELECTED_COUNT=$((SELECTED_COUNT + 1))
          done
          if [ "$SELECTED_COUNT" -eq 0 ]; then
            echo "::error::No apps selected for release. Tick at least one app boolean before dispatching."
            exit 1
          fi

          # ── 2. Fail if tag already exists ─────────────────────────────────
          if git tag -l "$TAG" | grep -q "^${TAG}$"; then
            echo "::error::Tag '${TAG}' already exists. Stack versions are cut once. Use a different stack_version."
            exit 1
          fi

          # ── 3. Find previous stack tag ────────────────────────────────────
          PREV_TAG=$(git tag -l 'ascend-ai_*' | sort -V | tail -n1)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous ascend-ai_* tag found — this is the first release. Bump guard skipped."
          else
            echo "Previous stack tag: ${PREV_TAG}"
          fi

          # ── 4. Read current manifest versions ─────────────────────────────
          #
          # Java: version = "<x.y.z>" on a line in build.gradle.kts
          #   Actual line shape (both services): `version = "0.0.1"`
          #   Extractor: grep -oP '(?<=^version = ")[^"]+' on the file
          #
          # Python: [project].version in pyproject.toml
          #   Actual line shape: `version = "0.9.0"`
          #   Extractor: python3 -c "import tomllib; print(tomllib.load(open(...,'rb'))['project']['version'])"

          read_java_version() {
            local manifest="$1"
            grep -oP '(?<=^version = ")[^"]+' "$manifest" | head -1
          }

          read_python_version() {
            local manifest="$1"
            python3 -c "import tomllib; print(tomllib.load(open('${manifest}','rb'))['project']['version'])"
          }

          read_prev_java_version() {
            local prev_tag="$1" manifest_path="$2"
            git show "${prev_tag}:${manifest_path}" | grep -oP '(?<=^version = ")[^"]+' | head -1
          }

          read_prev_python_version() {
            local prev_tag="$1" manifest_path="$2"
            git show "${prev_tag}:${manifest_path}" | python3 -c "import sys,tomllib; print(tomllib.load(sys.stdin.buffer)['project']['version'])"
          }

          # ── 5. Bump guard + matrix construction ───────────────────────────
          MATRIX_INCLUDE="[]"

          add_to_matrix() {
            local service="$1" path="$2" language="$3" version="$4"
            MATRIX_INCLUDE=$(echo "$MATRIX_INCLUDE" | python3 -c "import sys,json; a=json.load(sys.stdin); a.append({'service':'${service}','path':'${path}','language':'${language}','version':'${version}'}); print(json.dumps(a))")
          }

          check_and_add() {
            local selected="$1" service="$2" path="$3" language="$4" manifest="$5"

            if [ "$selected" != "true" ]; then
              return
            fi

            if [ "$language" = "java" ]; then
              CUR_VERSION=$(read_java_version "$manifest")
            else
              CUR_VERSION=$(read_python_version "$manifest")
            fi

            if [ -z "$CUR_VERSION" ]; then
              echo "::error::Could not read version from ${manifest} for service ${service}."
              exit 1
            fi

            if [ -n "$PREV_TAG" ]; then
              if [ "$language" = "java" ]; then
                PREV_VERSION=$(read_prev_java_version "$PREV_TAG" "$manifest")
              else
                PREV_VERSION=$(read_prev_python_version "$PREV_TAG" "$manifest")
              fi

              if [ -z "$PREV_VERSION" ]; then
                echo "::warning::Could not read ${service} version at ${PREV_TAG} — treating as unbumped would be a false negative; assuming bumped."
              elif [ "$CUR_VERSION" = "$PREV_VERSION" ]; then
                echo "::error::${service} version is still ${CUR_VERSION} (unchanged since ${PREV_TAG}). Bump the version in ${manifest} before releasing ${service}."
                exit 1
              fi
            fi

            echo "${service}: ${CUR_VERSION}"
            add_to_matrix "$service" "$path" "$language" "$CUR_VERSION"
          }

          check_and_add "$SEL_ASCEND_AGENT"      "ascend-agent"     "AscendAgent"    "java"   "AscendAgent/build.gradle.kts"
          check_and_add "$SEL_WEATHER_MCP"        "weather-mcp"      "WeatherMCP"     "java"   "WeatherMCP/build.gradle.kts"
          check_and_add "$SEL_AUDIO_SCRIBE"       "audio-scribe"     "AudioScribe"    "python" "AudioScribe/pyproject.toml"
          check_and_add "$SEL_ASCEND_WEB_SEARCH"  "ascend-web-search" "AscendWebSearch" "python" "AscendWebSearch/pyproject.toml"
          check_and_add "$SEL_ASCEND_MEMORY"      "ascend-memory"    "AscendMemory"   "python" "AscendMemory/pyproject.toml"
          check_and_add "$SEL_PADDLE_OCR"         "ascend-paddle-ocr"       "PaddleOCR"      "python" "PaddleOCR/pyproject.toml"

          MATRIX="{\"include\":${MATRIX_INCLUDE}}"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & push ${{ matrix.service }}:${{ matrix.version }}
    needs: prepare
    if: ${{ fromJSON(needs.prepare.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            lukk17/${{ matrix.service }}:${{ matrix.version }}
            lukk17/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  release:
    name: Create GitHub Release ascend-ai_${{ inputs.stack_version }}
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Read all app versions and compose release body
        id: body
        env:
          STACK_VERSION: ${{ inputs.stack_version }}
          SEL_ASCEND_AGENT:      ${{ inputs.release_ascend_agent }}
          SEL_WEATHER_MCP:       ${{ inputs.release_weather_mcp }}
          SEL_AUDIO_SCRIBE:      ${{ inputs.release_audio_scribe }}
          SEL_ASCEND_WEB_SEARCH: ${{ inputs.release_ascend_web_search }}
          SEL_ASCEND_MEMORY:     ${{ inputs.release_ascend_memory }}
          SEL_PADDLE_OCR:        ${{ inputs.release_paddle_ocr }}
        run: |
          set -euo pipefail

          read_java_version() {
            grep -oP '(?<=^version = ")[^"]+' "$1" | head -1
          }

          read_python_version() {
            python3 -c "import tomllib; print(tomllib.load(open('$1','rb'))['project']['version'])"
          }

          V_ASCEND_AGENT=$(read_java_version "AscendAgent/build.gradle.kts")
          V_WEATHER_MCP=$(read_java_version "WeatherMCP/build.gradle.kts")
          V_AUDIO_SCRIBE=$(read_python_version "AudioScribe/pyproject.toml")
          V_ASCEND_WEB_SEARCH=$(read_python_version "AscendWebSearch/pyproject.toml")
          V_ASCEND_MEMORY=$(read_python_version "AscendMemory/pyproject.toml")
          V_PADDLE_OCR=$(read_python_version "PaddleOCR/pyproject.toml")

          label() {
            local flag="$1"
            [ "$flag" = "true" ] && echo " (released)" || echo ""
          }

          # Compose release body using printf into a file (heredoc terminators
          # at column 0 are invalid inside a YAML block scalar)
          {
            printf "## ascend-ai_%s\n\n" "${STACK_VERSION}"
            printf "### App versions\n\n"
            printf "| Service | Version | |\n"
            printf "|---|---|---|\n"
            printf "| ascend-agent | %s |%s |\n"       "${V_ASCEND_AGENT}"      "$(label "$SEL_ASCEND_AGENT")"
            printf "| weather-mcp | %s |%s |\n"        "${V_WEATHER_MCP}"       "$(label "$SEL_WEATHER_MCP")"
            printf "| audio-scribe | %s |%s |\n"       "${V_AUDIO_SCRIBE}"      "$(label "$SEL_AUDIO_SCRIBE")"
            printf "| ascend-web-search | %s |%s |\n"  "${V_ASCEND_WEB_SEARCH}" "$(label "$SEL_ASCEND_WEB_SEARCH")"
            printf "| ascend-memory | %s |%s |\n"      "${V_ASCEND_MEMORY}"     "$(label "$SEL_ASCEND_MEMORY")"
            printf "| ascend-paddle-ocr | %s |%s |\n"         "${V_PADDLE_OCR}"        "$(label "$SEL_PADDLE_OCR")"
            printf "\nApps marked **(released)** had their images built and pushed in this run. All others carry their previous image.\n"
            printf "\n---\n"
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ascend-ai_${{ inputs.stack_version }}
          name: ascend-ai_${{ inputs.stack_version }}
          body_path: release-body.md
          generate_release_notes: true
          draft: false
          prerelease: false
