name: Release

on:
  workflow_dispatch:
    inputs:
      create_github_release:
        description: 'Cut the git tag and GitHub Release. Untick to publish images only, consuming no stack version.'
        required: true
        type: boolean
        default: true
      stack_version:
        description: 'Stack version (e.g. 1.1.1). The monorepo release tag will be ascend-ai_<stack_version>. Ignored when create_github_release is unticked.'
        required: false
        default: ''
        type: string
      release_ascend_ai_agent:
        description: 'Release ascend-ai-agent (apps/ascend-agent/CHANGELOG.md version)'
        required: true
        type: boolean
        default: false
      release_ascend_weather_mcp:
        description: 'Release ascend-weather-mcp (apps/ascend-weather-mcp/CHANGELOG.md version)'
        required: true
        type: boolean
        default: false
      release_ascend_audio_scribe:
        description: 'Release ascend-audio-scribe (apps/ascend-audio-scribe/CHANGELOG.md version)'
        required: true
        type: boolean
        default: false
      release_ascend_web_hunter:
        description: 'Release ascend-web-hunter (apps/ascend-web-hunter/CHANGELOG.md version)'
        required: true
        type: boolean
        default: false
      release_ascend_memory:
        description: 'Release ascend-memory (apps/ascend-memory/CHANGELOG.md version)'
        required: true
        type: boolean
        default: false
      release_ascend_ocr:
        description: 'Release ascend-ocr (apps/ascend-ocr/CHANGELOG.md version)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.stack_version || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate and build release matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Validate inputs and build release matrix
        id: emit
        env:
          STACK_VERSION: ${{ inputs.stack_version }}
          CREATE_RELEASE: ${{ inputs.create_github_release }}
          SEL_ASCEND_AI_AGENT:  ${{ inputs.release_ascend_ai_agent }}
          SEL_ASCEND_WEATHER_MCP:      ${{ inputs.release_ascend_weather_mcp }}
          SEL_ASCEND_AUDIO_SCRIBE:     ${{ inputs.release_ascend_audio_scribe }}
          SEL_ASCEND_WEB_HUNTER: ${{ inputs.release_ascend_web_hunter }}
          SEL_ASCEND_MEMORY:    ${{ inputs.release_ascend_memory }}
          SEL_ASCEND_OCR:       ${{ inputs.release_ascend_ocr }}
        run: |
          set -euo pipefail

          # ── 1. Fail if zero apps selected ─────────────────────────────────
          SELECTED_COUNT=0
          for VAR in "$SEL_ASCEND_AI_AGENT" "$SEL_ASCEND_WEATHER_MCP" "$SEL_ASCEND_AUDIO_SCRIBE" "$SEL_ASCEND_WEB_HUNTER" "$SEL_ASCEND_MEMORY" "$SEL_ASCEND_OCR"; do
            [ "$VAR" = "true" ] && SELECTED_COUNT=$((SELECTED_COUNT + 1))
          done
          if [ "$SELECTED_COUNT" -eq 0 ]; then
            echo "::error::No apps selected for release. Tick at least one app boolean before dispatching."
            exit 1
          fi

          # ── 2. Stack-version checks, only when a release is being cut ─────
          if [ "$CREATE_RELEASE" = "true" ]; then
            if [ -z "$STACK_VERSION" ]; then
              echo "::error::stack_version is required when create_github_release is ticked."
              exit 1
            fi

            TAG="ascend-ai_${STACK_VERSION}"

            if git tag -l "$TAG" | grep -q "^${TAG}$"; then
              echo "::error::Tag '${TAG}' already exists. Stack versions are cut once. Use a different stack_version."
              exit 1
            fi
          else
            echo "::notice::create_github_release is unticked. Images will be published with no git tag and no GitHub Release, and no stack version is consumed."
          fi

          # ── 3. Read current versions from each app's CHANGELOG.md ─────────
          #
          # Every app's CHANGELOG.md carries its version in the topmost entry,
          # shape: `## [0.0.1]` optionally followed by ` - <date>`. The
          # changelog is the source of truth the release workflow reads; the
          # `version` in build.gradle.kts / pyproject.toml is a cosmetic
          # per-module label the release workflow never reads, and the two
          # are allowed to disagree with no pipeline consequence. The actual
          # "was this bumped" guard runs later, per app, against the
          # registries themselves (see build-and-push) rather than against
          # git history, so it cannot break when a module's path moves.

          read_changelog_version() {
            local changelog="$1"
            grep -oP -m1 '##\s*\[\K[0-9]+\.[0-9]+\.[0-9]+' "$changelog"
          }

          MATRIX_INCLUDE="[]"

          add_to_matrix() {
            local service="$1" path="$2" version="$3" image_name="$4"
            MATRIX_INCLUDE=$(echo "$MATRIX_INCLUDE" | python3 -c "import sys,json; a=json.load(sys.stdin); a.append({'service':'${service}','path':'${path}','version':'${version}','image_name':'${image_name}'}); print(json.dumps(a))")
          }

          check_and_add() {
            local selected="$1" service="$2" path="$3" changelog="$4"

            if [ "$selected" != "true" ]; then
              return
            fi

            CUR_VERSION=$(read_changelog_version "$changelog") || true
            if [ -z "$CUR_VERSION" ]; then
              echo "::error::Could not read a '## [x.y.z]' version entry from ${changelog} for service ${service}."
              exit 1
            fi

            local image_name="ascend-ai-${service}"
            echo "${service}: ${CUR_VERSION}"
            add_to_matrix "$service" "$path" "$CUR_VERSION" "$image_name"
          }

          check_and_add "$SEL_ASCEND_AI_AGENT"     "ascend-agent"     "apps/ascend-agent"     "apps/ascend-agent/CHANGELOG.md"
          check_and_add "$SEL_ASCEND_WEATHER_MCP"  "ascend-weather-mcp"  "apps/ascend-weather-mcp"  "apps/ascend-weather-mcp/CHANGELOG.md"
          check_and_add "$SEL_ASCEND_AUDIO_SCRIBE" "ascend-audio-scribe" "apps/ascend-audio-scribe" "apps/ascend-audio-scribe/CHANGELOG.md"
          check_and_add "$SEL_ASCEND_WEB_HUNTER"   "ascend-web-hunter"   "apps/ascend-web-hunter"   "apps/ascend-web-hunter/CHANGELOG.md"
          check_and_add "$SEL_ASCEND_MEMORY"       "ascend-memory"       "apps/ascend-memory"       "apps/ascend-memory/CHANGELOG.md"
          check_and_add "$SEL_ASCEND_OCR"          "ascend-ocr"          "apps/ascend-ocr"          "apps/ascend-ocr/CHANGELOG.md"

          MATRIX="{\"include\":${MATRIX_INCLUDE}}"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & push ${{ matrix.service }}:v${{ matrix.version }}
    needs: prepare
    if: ${{ fromJSON(needs.prepare.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Guard against re-publishing an already-released version
        run: |
          set -euo pipefail

          SERVICE="${{ matrix.service }}"
          VERSION="${{ matrix.version }}"
          IMAGE_NAME="${{ matrix.image_name }}"
          DOCKERHUB_IMAGE="lukk17/${IMAGE_NAME}"
          GHCR_IMAGE="ghcr.io/lukk17/${IMAGE_NAME}"

          # Checked against both registries this stack publishes to. A tag
          # present on both is a completed prior release of this exact
          # version — fail and ask for a new CHANGELOG.md entry. Present on
          # neither is the normal case — proceed. Present on exactly one is
          # treated as an incomplete prior publish (for example Docker Hub
          # succeeded and GHCR failed on a transient auth/network error) and
          # is completed rather than blocked, since the code a bumped
          # CHANGELOG.md entry would gate is unchanged either way — the
          # pull-request changelog check already refuses to merge module
          # changes without a version bump, so nothing here re-ships altered
          # content under an old version number.
          check_tag() {
            local image="$1"
            local output status
            set +e
            output=$(docker manifest inspect "${image}:v${VERSION}" 2>&1)
            status=$?
            set -e

            if [ "${status}" -eq 0 ]; then
              printf 'found\n'
              return 0
            fi

            if printf '%s' "${output}" | grep -qiE 'no such manifest|manifest unknown|not found'; then
              printf 'absent\n'
              return 0
            fi

            printf '::error::Could not determine whether %s:v%s exists (auth/network error). Failing closed without pushing.\n%s\n' "${image}" "${VERSION}" "${output}" >&2
            return 1
          }

          DOCKERHUB_STATE=$(check_tag "${DOCKERHUB_IMAGE}")
          GHCR_STATE=$(check_tag "${GHCR_IMAGE}")

          if [ "${DOCKERHUB_STATE}" = "found" ] && [ "${GHCR_STATE}" = "found" ]; then
            echo "::error::${SERVICE} v${VERSION} already exists on both registries. Add a new CHANGELOG.md entry before releasing."
            exit 1
          fi

          if [ "${DOCKERHUB_STATE}" = "found" ] || [ "${GHCR_STATE}" = "found" ]; then
            echo "::warning::${SERVICE} v${VERSION} already exists on one registry only (dockerhub=${DOCKERHUB_STATE}, ghcr=${GHCR_STATE}). Treating this as an incomplete previous publish and completing it on both registries."
          fi

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            lukk17/${{ matrix.image_name }}:v${{ matrix.version }}
            lukk17/${{ matrix.image_name }}:latest
            ghcr.io/lukk17/${{ matrix.image_name }}:v${{ matrix.version }}
            ghcr.io/lukk17/${{ matrix.image_name }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  release:
    name: Create GitHub Release ascend-ai_${{ inputs.stack_version }}
    needs: build-and-push
    if: ${{ inputs.create_github_release }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Read all app versions and compose release body
        id: body
        env:
          STACK_VERSION: ${{ inputs.stack_version }}
          SEL_ASCEND_AI_AGENT:   ${{ inputs.release_ascend_ai_agent }}
          SEL_ASCEND_WEATHER_MCP:       ${{ inputs.release_ascend_weather_mcp }}
          SEL_ASCEND_AUDIO_SCRIBE:      ${{ inputs.release_ascend_audio_scribe }}
          SEL_ASCEND_WEB_HUNTER: ${{ inputs.release_ascend_web_hunter }}
          SEL_ASCEND_MEMORY:     ${{ inputs.release_ascend_memory }}
          SEL_ASCEND_OCR:        ${{ inputs.release_ascend_ocr }}
        run: |
          set -euo pipefail

          read_changelog_version() {
            grep -oP -m1 '##\s*\[\K[0-9]+\.[0-9]+\.[0-9]+' "$1"
          }

          V_ASCEND_AI_AGENT=$(read_changelog_version "apps/ascend-agent/CHANGELOG.md")
          V_ASCEND_WEATHER_MCP=$(read_changelog_version "apps/ascend-weather-mcp/CHANGELOG.md")
          V_ASCEND_AUDIO_SCRIBE=$(read_changelog_version "apps/ascend-audio-scribe/CHANGELOG.md")
          V_ASCEND_WEB_HUNTER=$(read_changelog_version "apps/ascend-web-hunter/CHANGELOG.md")
          V_ASCEND_MEMORY=$(read_changelog_version "apps/ascend-memory/CHANGELOG.md")
          V_ASCEND_OCR=$(read_changelog_version "apps/ascend-ocr/CHANGELOG.md")

          label() {
            local flag="$1"
            [ "$flag" = "true" ] && echo " (released)" || echo ""
          }

          # Compose release body using printf into a file (heredoc terminators
          # at column 0 are invalid inside a YAML block scalar)
          {
            printf "## ascend-ai_%s\n\n" "${STACK_VERSION}"
            printf "### App versions\n\n"
            printf "| Service | Version | |\n"
            printf "|---|---|---|\n"
            printf "| ascend-ai-agent | %s |%s |\n"    "${V_ASCEND_AI_AGENT}"   "$(label "$SEL_ASCEND_AI_AGENT")"
            printf "| ascend-weather-mcp | %s |%s |\n"        "${V_ASCEND_WEATHER_MCP}"       "$(label "$SEL_ASCEND_WEATHER_MCP")"
            printf "| ascend-audio-scribe | %s |%s |\n"       "${V_ASCEND_AUDIO_SCRIBE}"      "$(label "$SEL_ASCEND_AUDIO_SCRIBE")"
            printf "| ascend-web-hunter | %s |%s |\n"  "${V_ASCEND_WEB_HUNTER}" "$(label "$SEL_ASCEND_WEB_HUNTER")"
            printf "| ascend-memory | %s |%s |\n"      "${V_ASCEND_MEMORY}"     "$(label "$SEL_ASCEND_MEMORY")"
            printf "| ascend-ocr | %s |%s |\n"         "${V_ASCEND_OCR}"        "$(label "$SEL_ASCEND_OCR")"
            printf "\nApps marked **(released)** had their images built and pushed in this run. All others carry their previous image.\n"
            printf "\n---\n"
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ascend-ai_${{ inputs.stack_version }}
          name: ascend-ai_${{ inputs.stack_version }}
          body_path: release-body.md
          generate_release_notes: true
          draft: false
          prerelease: false
