name: Release

on:
  workflow_dispatch:
    inputs:
      create_github_release:
        description: 'Cut the git tag and GitHub Release. Untick to publish images only, consuming no stack version.'
        required: true
        type: boolean
        default: true
      stack_version:
        description: 'Stack version (e.g. 1.1.1). The monorepo release tag will be ascend-ai_<stack_version>. Ignored when create_github_release is unticked.'
        required: false
        default: ''
        type: string
      release_ascend_ai_agent:
        description: 'Release ascend-ai-agent (apps/ascend-ai-agent/build.gradle.kts version)'
        required: true
        type: boolean
        default: false
      release_ascend_weather_mcp:
        description: 'Release ascend-weather-mcp (apps/ascend-weather-mcp/build.gradle.kts version)'
        required: true
        type: boolean
        default: false
      release_ascend_audio_scribe:
        description: 'Release ascend-audio-scribe (apps/ascend-audio-scribe/pyproject.toml version)'
        required: true
        type: boolean
        default: false
      release_ascend_web_hunter:
        description: 'Release ascend-web-hunter (apps/ascend-web-hunter/pyproject.toml version)'
        required: true
        type: boolean
        default: false
      release_ascend_memory:
        description: 'Release ascend-memory (apps/ascend-memory/pyproject.toml version)'
        required: true
        type: boolean
        default: false
      release_ascend_ocr:
        description: 'Release ascend-ocr (apps/ascend-ocr/pyproject.toml version)'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.stack_version || github.run_id }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate and build release matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.emit.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Validate inputs and build release matrix
        id: emit
        env:
          STACK_VERSION: ${{ inputs.stack_version }}
          CREATE_RELEASE: ${{ inputs.create_github_release }}
          SEL_ASCEND_AI_AGENT:  ${{ inputs.release_ascend_ai_agent }}
          SEL_ASCEND_WEATHER_MCP:      ${{ inputs.release_ascend_weather_mcp }}
          SEL_ASCEND_AUDIO_SCRIBE:     ${{ inputs.release_ascend_audio_scribe }}
          SEL_ASCEND_WEB_HUNTER: ${{ inputs.release_ascend_web_hunter }}
          SEL_ASCEND_MEMORY:    ${{ inputs.release_ascend_memory }}
          SEL_ASCEND_OCR:       ${{ inputs.release_ascend_ocr }}
        run: |
          set -euo pipefail

          # ── 1. Fail if zero apps selected ─────────────────────────────────
          SELECTED_COUNT=0
          for VAR in "$SEL_ASCEND_AI_AGENT" "$SEL_ASCEND_WEATHER_MCP" "$SEL_ASCEND_AUDIO_SCRIBE" "$SEL_ASCEND_WEB_HUNTER" "$SEL_ASCEND_MEMORY" "$SEL_ASCEND_OCR"; do
            [ "$VAR" = "true" ] && SELECTED_COUNT=$((SELECTED_COUNT + 1))
          done
          if [ "$SELECTED_COUNT" -eq 0 ]; then
            echo "::error::No apps selected for release. Tick at least one app boolean before dispatching."
            exit 1
          fi

          # ── 2. Stack-version checks, only when a release is being cut ─────
          if [ "$CREATE_RELEASE" = "true" ]; then
            if [ -z "$STACK_VERSION" ]; then
              echo "::error::stack_version is required when create_github_release is ticked."
              exit 1
            fi

            TAG="ascend-ai_${STACK_VERSION}"

            if git tag -l "$TAG" | grep -q "^${TAG}$"; then
              echo "::error::Tag '${TAG}' already exists. Stack versions are cut once. Use a different stack_version."
              exit 1
            fi
          else
            echo "::notice::create_github_release is unticked. Images will be published with no git tag and no GitHub Release, and no stack version is consumed."
          fi

          # ── 3. Find previous stack tag ────────────────────────────────────
          PREV_TAG=$(git tag -l 'ascend-ai_*' | sort -V | tail -n1)
          if [ -z "$PREV_TAG" ]; then
            echo "No previous ascend-ai_* tag found — this is the first release. Bump guard skipped."
          else
            echo "Previous stack tag: ${PREV_TAG}"
          fi

          # ── 4. Read current manifest versions ─────────────────────────────
          #
          # Java: version = "<x.y.z>" on a line in build.gradle.kts
          #   Actual line shape (both services): `version = "0.0.1"`
          #   Extractor: grep -oP '(?<=^version = ")[^"]+' on the file
          #
          # Python: [project].version in pyproject.toml
          #   Actual line shape: `version = "0.9.0"`
          #   Extractor: python3 -c "import tomllib; print(tomllib.load(open(...,'rb'))['project']['version'])"

          read_java_version() {
            local manifest="$1"
            grep -oP '(?<=^version = ")[^"]+' "$manifest" | head -1
          }

          read_python_version() {
            local manifest="$1"
            python3 -c "import tomllib; print(tomllib.load(open('${manifest}','rb'))['project']['version'])"
          }

          read_prev_java_version() {
            local prev_tag="$1" manifest_path="$2"
            git show "${prev_tag}:${manifest_path}" | grep -oP '(?<=^version = ")[^"]+' | head -1
          }

          read_prev_python_version() {
            local prev_tag="$1" manifest_path="$2"
            git show "${prev_tag}:${manifest_path}" | python3 -c "import sys,tomllib; print(tomllib.load(sys.stdin.buffer)['project']['version'])"
          }

          # ── 5. Bump guard + matrix construction ───────────────────────────
          MATRIX_INCLUDE="[]"

          add_to_matrix() {
            local service="$1" path="$2" language="$3" version="$4"
            MATRIX_INCLUDE=$(echo "$MATRIX_INCLUDE" | python3 -c "import sys,json; a=json.load(sys.stdin); a.append({'service':'${service}','path':'${path}','language':'${language}','version':'${version}'}); print(json.dumps(a))")
          }

          check_and_add() {
            local selected="$1" service="$2" path="$3" language="$4" manifest="$5"

            if [ "$selected" != "true" ]; then
              return
            fi

            if [ "$language" = "java" ]; then
              CUR_VERSION=$(read_java_version "$manifest")
            else
              CUR_VERSION=$(read_python_version "$manifest")
            fi

            if [ -z "$CUR_VERSION" ]; then
              echo "::error::Could not read version from ${manifest} for service ${service}."
              exit 1
            fi

            if [ -n "$PREV_TAG" ]; then
              if [ "$language" = "java" ]; then
                PREV_VERSION=$(read_prev_java_version "$PREV_TAG" "$manifest")
              else
                PREV_VERSION=$(read_prev_python_version "$PREV_TAG" "$manifest")
              fi

              if [ -z "$PREV_VERSION" ]; then
                echo "::warning::Could not read ${service} version at ${PREV_TAG} — treating as unbumped would be a false negative; assuming bumped."
              elif [ "$CUR_VERSION" = "$PREV_VERSION" ]; then
                echo "::error::${service} version is still ${CUR_VERSION} (unchanged since ${PREV_TAG}). Bump the version in ${manifest} before releasing ${service}."
                exit 1
              fi
            fi

            echo "${service}: ${CUR_VERSION}"
            add_to_matrix "$service" "$path" "$language" "$CUR_VERSION"
          }

          check_and_add "$SEL_ASCEND_AI_AGENT"    "ascend-ai-agent"  "apps/ascend-ai-agent"    "java"   "apps/ascend-ai-agent/build.gradle.kts"
          check_and_add "$SEL_ASCEND_WEATHER_MCP"        "ascend-weather-mcp"      "apps/ascend-weather-mcp"     "java"   "apps/ascend-weather-mcp/build.gradle.kts"
          check_and_add "$SEL_ASCEND_AUDIO_SCRIBE"       "ascend-audio-scribe"     "apps/ascend-audio-scribe"    "python" "apps/ascend-audio-scribe/pyproject.toml"
          check_and_add "$SEL_ASCEND_WEB_HUNTER"  "ascend-web-hunter" "apps/ascend-web-hunter" "python" "apps/ascend-web-hunter/pyproject.toml"
          check_and_add "$SEL_ASCEND_MEMORY"      "ascend-memory"    "apps/ascend-memory"   "python" "apps/ascend-memory/pyproject.toml"
          check_and_add "$SEL_ASCEND_OCR"         "ascend-ocr"       "apps/ascend-ocr"      "python" "apps/ascend-ocr/pyproject.toml"

          MATRIX="{\"include\":${MATRIX_INCLUDE}}"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build-and-push:
    name: Build & push ${{ matrix.service }}:v${{ matrix.version }}
    needs: prepare
    if: ${{ fromJSON(needs.prepare.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            lukk17/${{ matrix.service }}:v${{ matrix.version }}
            lukk17/${{ matrix.service }}:latest
            ghcr.io/lukk17/${{ matrix.service }}:v${{ matrix.version }}
            ghcr.io/lukk17/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  release:
    name: Create GitHub Release ascend-ai_${{ inputs.stack_version }}
    needs: build-and-push
    if: ${{ inputs.create_github_release }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Read all app versions and compose release body
        id: body
        env:
          STACK_VERSION: ${{ inputs.stack_version }}
          SEL_ASCEND_AI_AGENT:   ${{ inputs.release_ascend_ai_agent }}
          SEL_ASCEND_WEATHER_MCP:       ${{ inputs.release_ascend_weather_mcp }}
          SEL_ASCEND_AUDIO_SCRIBE:      ${{ inputs.release_ascend_audio_scribe }}
          SEL_ASCEND_WEB_HUNTER: ${{ inputs.release_ascend_web_hunter }}
          SEL_ASCEND_MEMORY:     ${{ inputs.release_ascend_memory }}
          SEL_ASCEND_OCR:        ${{ inputs.release_ascend_ocr }}
        run: |
          set -euo pipefail

          read_java_version() {
            grep -oP '(?<=^version = ")[^"]+' "$1" | head -1
          }

          read_python_version() {
            python3 -c "import tomllib; print(tomllib.load(open('$1','rb'))['project']['version'])"
          }

          V_ASCEND_AI_AGENT=$(read_java_version "apps/ascend-ai-agent/build.gradle.kts")
          V_ASCEND_WEATHER_MCP=$(read_java_version "apps/ascend-weather-mcp/build.gradle.kts")
          V_ASCEND_AUDIO_SCRIBE=$(read_python_version "apps/ascend-audio-scribe/pyproject.toml")
          V_ASCEND_WEB_HUNTER=$(read_python_version "apps/ascend-web-hunter/pyproject.toml")
          V_ASCEND_MEMORY=$(read_python_version "apps/ascend-memory/pyproject.toml")
          V_ASCEND_OCR=$(read_python_version "apps/ascend-ocr/pyproject.toml")

          label() {
            local flag="$1"
            [ "$flag" = "true" ] && echo " (released)" || echo ""
          }

          # Compose release body using printf into a file (heredoc terminators
          # at column 0 are invalid inside a YAML block scalar)
          {
            printf "## ascend-ai_%s\n\n" "${STACK_VERSION}"
            printf "### App versions\n\n"
            printf "| Service | Version | |\n"
            printf "|---|---|---|\n"
            printf "| ascend-ai-agent | %s |%s |\n"    "${V_ASCEND_AI_AGENT}"   "$(label "$SEL_ASCEND_AI_AGENT")"
            printf "| ascend-weather-mcp | %s |%s |\n"        "${V_ASCEND_WEATHER_MCP}"       "$(label "$SEL_ASCEND_WEATHER_MCP")"
            printf "| ascend-audio-scribe | %s |%s |\n"       "${V_ASCEND_AUDIO_SCRIBE}"      "$(label "$SEL_ASCEND_AUDIO_SCRIBE")"
            printf "| ascend-web-hunter | %s |%s |\n"  "${V_ASCEND_WEB_HUNTER}" "$(label "$SEL_ASCEND_WEB_HUNTER")"
            printf "| ascend-memory | %s |%s |\n"      "${V_ASCEND_MEMORY}"     "$(label "$SEL_ASCEND_MEMORY")"
            printf "| ascend-ocr | %s |%s |\n"         "${V_ASCEND_OCR}"        "$(label "$SEL_ASCEND_OCR")"
            printf "\nApps marked **(released)** had their images built and pushed in this run. All others carry their previous image.\n"
            printf "\n---\n"
          } > release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ascend-ai_${{ inputs.stack_version }}
          name: ascend-ai_${{ inputs.stack_version }}
          body_path: release-body.md
          generate_release_notes: true
          draft: false
          prerelease: false
