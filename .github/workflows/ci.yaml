name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      ascend_ai_agent: ${{ steps.filter.outputs.ascend-ai-agent == 'true' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect path changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            ascend-ai-agent:
              - 'apps/ascend-ai-agent/**'
            ascend-weather-mcp:
              - 'apps/ascend-weather-mcp/**'
            ascend-audio-scribe:
              - 'apps/ascend-audio-scribe/**'
            ascend-web-hunter:
              - 'apps/ascend-web-hunter/**'
            ascend-memory:
              - 'apps/ascend-memory/**'
            ascend-ocr:
              - 'apps/ascend-ocr/**'
            workflows:
              - '.github/workflows/**'

      - name: Build dynamic matrix
        id: build-matrix
        run: |
          ALL_SERVICES='[
            {"service":"ascend-ai-agent",    "language":"java",   "path":"apps/ascend-ai-agent",    "python_version":""},
            {"service":"ascend-weather-mcp",     "language":"java",   "path":"apps/ascend-weather-mcp",     "python_version":""},
            {"service":"ascend-audio-scribe",    "language":"python", "path":"apps/ascend-audio-scribe",    "python_version":"3.11"},
            {"service":"ascend-web-hunter","language":"python","path":"apps/ascend-web-hunter","python_version":"3.12"},
            {"service":"ascend-memory",   "language":"python", "path":"apps/ascend-memory",   "python_version":"3.11"},
            {"service":"ascend-ocr",      "language":"python", "path":"apps/ascend-ocr",      "python_version":"3.11"}
          ]'

          WORKFLOWS_CHANGED="${{ steps.filter.outputs.workflows }}"
          ASCEND_AI_AGENT="${{ steps.filter.outputs.ascend-ai-agent }}"
          ASCEND_WEATHER_MCP="${{ steps.filter.outputs.ascend-weather-mcp }}"
          ASCEND_AUDIO_SCRIBE="${{ steps.filter.outputs.ascend-audio-scribe }}"
          ASCEND_WEB_HUNTER="${{ steps.filter.outputs.ascend-web-hunter }}"
          ASCEND_MEMORY="${{ steps.filter.outputs.ascend-memory }}"
          ASCEND_OCR="${{ steps.filter.outputs.ascend-ocr }}"

          if [ "$WORKFLOWS_CHANGED" = "true" ]; then
            MATRIX="{\"include\":$(echo "$ALL_SERVICES" | python3 -c 'import sys,json; print(json.dumps(json.load(sys.stdin)))')}"
          else
            INCLUDE="[]"
            if [ "$ASCEND_AI_AGENT"  = "true" ]; then INCLUDE=$(echo "$INCLUDE" | python3 -c 'import sys,json; a=json.load(sys.stdin); a.append({"service":"ascend-ai-agent","language":"java","path":"apps/ascend-ai-agent","python_version":""}); print(json.dumps(a))'); fi
            if [ "$ASCEND_WEATHER_MCP"      = "true" ]; then INCLUDE=$(echo "$INCLUDE" | python3 -c 'import sys,json; a=json.load(sys.stdin); a.append({"service":"ascend-weather-mcp","language":"java","path":"apps/ascend-weather-mcp","python_version":""}); print(json.dumps(a))'); fi
            if [ "$ASCEND_AUDIO_SCRIBE"     = "true" ]; then INCLUDE=$(echo "$INCLUDE" | python3 -c 'import sys,json; a=json.load(sys.stdin); a.append({"service":"ascend-audio-scribe","language":"python","path":"apps/ascend-audio-scribe","python_version":"3.11"}); print(json.dumps(a))'); fi
            if [ "$ASCEND_WEB_HUNTER" = "true" ]; then INCLUDE=$(echo "$INCLUDE" | python3 -c 'import sys,json; a=json.load(sys.stdin); a.append({"service":"ascend-web-hunter","language":"python","path":"apps/ascend-web-hunter","python_version":"3.12"}); print(json.dumps(a))'); fi
            if [ "$ASCEND_MEMORY"    = "true" ]; then INCLUDE=$(echo "$INCLUDE" | python3 -c 'import sys,json; a=json.load(sys.stdin); a.append({"service":"ascend-memory","language":"python","path":"apps/ascend-memory","python_version":"3.11"}); print(json.dumps(a))'); fi
            if [ "$ASCEND_OCR"       = "true" ]; then INCLUDE=$(echo "$INCLUDE" | python3 -c 'import sys,json; a=json.load(sys.stdin); a.append({"service":"ascend-ocr","language":"python","path":"apps/ascend-ocr","python_version":"3.11"}); print(json.dumps(a))'); fi
            MATRIX="{\"include\":$INCLUDE}"
          fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    name: Build & test ${{ matrix.service }}
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      # ── Java steps ────────────────────────────────────────────────────────
      - name: Set up Java (Temurin 21)
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        if: matrix.language == 'java'
        uses: gradle/actions/setup-gradle@v3

      - name: Gradle build & test
        if: matrix.language == 'java'
        working-directory: ${{ matrix.path }}
        run: ./gradlew --no-daemon build test

      # ascend-ai-agent is the only Gradle module with a configured coverage
      # floor (jacocoTestCoverageVerification, 80% instruction coverage).
      # ascend-weather-mcp has no such task, so nothing runs for it here.
      - name: Enforce Jacoco coverage gate (ascend-ai-agent)
        if: matrix.service == 'ascend-ai-agent'
        working-directory: ${{ matrix.path }}
        run: ./gradlew --no-daemon jacocoTestCoverageVerification

      # ── Python steps ───────────────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python_version }}
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}
          cache: pip

      - name: Install service with dev extras
        if: matrix.language == 'python'
        working-directory: ${{ matrix.path }}
        run: pip install -e .[dev]

      - name: Ruff lint
        if: matrix.language == 'python'
        working-directory: ${{ matrix.path }}
        run: ruff check .

      - name: Mypy type check
        if: matrix.language == 'python'
        working-directory: ${{ matrix.path }}
        run: mypy src

      # ascend-audio-scribe and ascend-ocr already bake --cov-fail-under=100
      # into their own pytest addopts, so plain `pytest` enforces it.
      - name: Run pytest
        if: matrix.language == 'python' && matrix.service != 'ascend-web-hunter' && matrix.service != 'ascend-memory'
        working-directory: ${{ matrix.path }}
        run: pytest

      # ascend-web-hunter and ascend-memory declare fail_under=100 in
      # [tool.coverage.report] but do not bake it into pytest addopts, so the
      # coverage flags must be passed explicitly to actually enforce it.
      - name: Run pytest with coverage gate
        if: matrix.service == 'ascend-web-hunter' || matrix.service == 'ascend-memory'
        working-directory: ${{ matrix.path }}
        run: pytest --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=100

      # ── Artifact upload (always) ────────────────────────────────────────────
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: |
            ${{ matrix.path }}/build/test-results/**/*.xml
            ${{ matrix.path }}/.pytest_cache
            ${{ matrix.path }}/test-results
          if-no-files-found: ignore

  integration-test:
    name: Integration test (Testcontainers) ascend-ai-agent
    needs: changes
    if: ${{ needs.changes.outputs.ascend_ai_agent == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      # Runs in a separate job, in parallel with the fast unit-test matrix
      # above, rather than as an extra step in it: Testcontainers pulls and
      # boots Postgres, Redis and Qdrant images, which is slow and would
      # delay the fast unit-test signal for every other module. ubuntu-latest
      # ships a working Docker daemon, so no extra setup is needed here.
      - name: Gradle integration test (Testcontainers)
        working-directory: apps/ascend-ai-agent
        run: ./gradlew --no-daemon integrationTest

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-ascend-ai-agent
          path: apps/ascend-ai-agent/build/test-results/**/*.xml
          if-no-files-found: ignore
